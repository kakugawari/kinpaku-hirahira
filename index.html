<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover が無いと env(safe-area-inset-*) が常に 0 になり、
     下の操作帯がホームバーに、題字が時計に重なる -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>金箔ひらひら</title>
<!-- ===== PWA設定 ===== -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<!-- iOS: ホーム画面追加用 -->
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- 時計やダイナミックアイランドの裏まで絵を見せる。
     black に変えても、iOS はホーム画面に追加したときの設定を覚えているので
     効かなかった(実機で 位置0 のまま)。下まで届かせるのは vh で行う -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="金箔ひらひら">
<style>
  /* ===== 全体:漆器の質感を意識した黒基調 ===== */
  html, body {
    margin: 0; padding: 0;
    width: 100%;
    /* ホーム画面から開くと、iOS が渡す高さが上の安全域ぶん足りないこと
       がある(実機で 描ける873 / %873 なのに vh932 / 外932)。
       根っこの高さを vh で取ると、渡される高さ自体が 932 に変わり、
       画面の下まで届く。100% は古い端末向けの控え */
    height: 100%;
    height: 100vh;
    overflow: hidden;
    position: relative;
    background: #000000;
    touch-action: none;            /* スクロール等のブラウザ既定動作を無効化 */
    -webkit-user-select: none; user-select: none;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
  }
  canvas { display: block; }

  /* ===== 最初の案内文(触れると消える) ===== */
  #hint {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: rgba(220,190,120,0.55);
    font-size: 14px; letter-spacing: 0.25em;
    pointer-events: none;
    transition: opacity 1.2s ease;
    text-align: center;
    white-space: nowrap;
  }
  #hint.hidden { opacity: 0; }

  /* ===== 箔の棚(左上) =====
     いま選んでいる箔を大きく見せ、押すと下に品書きが開く。
     5種を並べたままだと場所を取りすぎるので、ふだんは1つだけ見せる */
  #palette {
    position: absolute;
    top: calc(10px + env(safe-area-inset-top, 0px));
    left: 12px;
    z-index: 5;
    display: flex; flex-direction: column; align-items: flex-start;
  }

  /* --- いま選んでいる箔(丸い額に入れて見せる) --- */
  #palette-open {
    display: flex; align-items: center; gap: 10px;
    background: none; border: 0; padding: 0;
    font-family: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .emblem {
    position: relative;
    width: 62px; height: 62px;
    display: grid; place-items: center;
    flex: 0 0 auto;
  }
  .emblem .foil {
    width: 42px; height: 42px;
    box-shadow: inset 0 0 8px rgba(0,0,0,0.45), 0 0 18px 2px rgba(240,200,110,0.35);
  }
  /* 額の輪。細い線と、四方の菱で和の額縁にする */
  .emblem svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  .now {
    display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
    color: rgba(244,228,186,0.92);
    font-size: 17px; letter-spacing: 0.22em;
    text-shadow: 0 0 10px rgba(201,162,75,0.35);
  }
  /* 名前の下の飾り罫(線 — 菱 — 線) */
  .rule {
    display: flex; align-items: center; gap: 4px;
    width: 96px; opacity: 0.75;
  }
  .rule i {
    flex: 1 1 auto; height: 1px;
    background: linear-gradient(to right,
      rgba(214,186,130,0.7), rgba(214,186,130,0.15));
  }
  .rule i:last-child {
    background: linear-gradient(to left,
      rgba(214,186,130,0.7), rgba(214,186,130,0.15));
  }
  .rule b {
    width: 5px; height: 5px; flex: 0 0 auto;
    background: rgba(226,196,130,0.85);
    transform: rotate(45deg);
  }

  /* --- 押すと開く品書き --- */
  #palette-list {
    position: relative;
    margin: 0 0 0 14px;
    /* 閉じているときは上下の余白も 0 にする。max-height だけ 0 にしても
       余白のぶん(12px)が残り、閉じきっていなかった */
    padding: 0 0 0 16px;
    display: flex; flex-direction: column; gap: 2px;
    overflow: hidden;
    max-height: 0; opacity: 0;
    transition: max-height 0.28s ease, padding 0.28s ease,
                margin 0.28s ease, opacity 0.2s ease;
    pointer-events: none;
  }
  #palette.open #palette-list {
    margin-top: 6px;
    padding: 6px 0 6px 16px;
    max-height: 260px; opacity: 1;
    pointer-events: auto;
  }
  /* 品書きの左に立てる細い柱。上下に菱の留めを置く */
  #palette-list::before {
    content: ""; position: absolute; left: 0; top: 8px; bottom: 8px;
    width: 1px;
    background: linear-gradient(to bottom,
      rgba(214,186,130,0), rgba(214,186,130,0.5), rgba(214,186,130,0));
  }
  /* 品書きの1行は「丸 + 名前」を横に並べる。
     下の帯の .swatch は縦並びなので、こちらを強く書いて上書きする */
  #palette-list .swatch {
    flex-direction: row; align-items: center; gap: 9px;
    min-width: 96px; padding: 3px 6px;
    font-size: 13px; letter-spacing: 0.18em;
  }
  #palette-list .foil { width: 24px; height: 24px; }
  #palette-list .cap { padding-bottom: 0; }
  #palette-list .swatch.active .cap::after { display: none; }
  #palette-list .swatch.active .foil {
    box-shadow: inset 0 0 6px rgba(0,0,0,0.35),
                0 0 0 1.2px rgba(255,240,196,0.85),
                0 0 12px 1px rgba(240,200,110,0.45);
  }

  /* ===== 下部の操作帯 =====
     箔も道具も「絵 + 名前」の縦並びで揃える。
     いま選んでいる箔は、輪の光と名前の下の線で示す ===== */
  #bar {
    /* 同じ理由で absolute。根っこの下端(=画面の下)に着く */
    position: absolute; bottom: 0; left: 0; right: 0;
    display: flex; align-items: flex-end; justify-content: center;
    gap: 7px;
    /* ホームバーに掛からないための余白。ただし、ウェブ画面の下端が
       ホームバーまで届いていなければ要らない(実機では 873 で終わり、
       ホームバーは 898 から。34pt ぶん無駄に空いていた) */
    padding: 12px 8px calc(10px + var(--下の余白, env(safe-area-inset-bottom, 0px)));
    background: linear-gradient(to top, rgba(0,0,0,0.92) 45%, rgba(0,0,0,0));
  }
  .swatch, .tool {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    min-width: 40px;             /* 指で押せる幅を切らさない */
    padding: 2px 3px;
    background: none; border: 0;
    font-family: inherit; font-size: 10px; letter-spacing: 0.06em;
    color: rgba(226,206,160,0.7);
    flex: 0 0 auto;              /* 詰まっても押し所を潰さない */
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .cap { position: relative; padding-bottom: 5px; white-space: nowrap; }

  /* ===== 箔:くしゃっとした金属の面 ===== */
  .foil {
    width: 34px; height: 34px; border-radius: 50%;
    box-shadow: inset 0 0 7px rgba(0,0,0,0.5);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .swatch.active, .hand.active { color: rgba(246,230,184,0.95); }
  /* 選ばれている指の道具は、絵も光らせる */
  .hand.active svg { filter: drop-shadow(0 0 7px rgba(240,216,120,0.5)); }
  .hand.active .cap::after {
    background: linear-gradient(to right,
      rgba(240,216,120,0), rgba(240,216,120,0.75), rgba(240,216,120,0)) !important;
  }
  /* お題の間は、ずらす・消すを使わない(採点が合わなくなる) */
  .hand.disabled { opacity: 0.32; }
  .swatch.active { color: rgba(246,230,184,0.95); }
  .swatch.active .foil {
    transform: scale(1.06);
    box-shadow: inset 0 0 7px rgba(0,0,0,0.35),
                0 0 0 1.5px rgba(255,240,196,0.85),
                0 0 16px 2px rgba(240,200,110,0.45);
  }
  /* 名前の下の線。選んでいる箔にだけ引く */
  .swatch.active .cap::after, .tool .cap::after {
    content: ""; position: absolute; bottom: 0; height: 1px;
    left: -2px; right: -2px;
    background: linear-gradient(to right,
      rgba(240,216,120,0), rgba(240,216,120,0.75), rgba(240,216,120,0));
  }
  .tool .cap::after { background: linear-gradient(to right,
      rgba(214,186,130,0), rgba(214,186,130,0.5), rgba(214,186,130,0)); }

  /* 箔の面は、光る所と翳る所をずらして重ねる。円錐グラデーションだけだと
     中心から風車のように筋が集まって、金属の板に見えてしまう */
  [data-foil="gold"] {
    background:
      radial-gradient(ellipse 62% 46% at 26% 22%, rgba(255,252,228,0.95) , rgba(0,0,0,0) 62%),
      radial-gradient(ellipse 46% 34% at 73% 69%, rgba(255,240,190,0.5), rgba(0,0,0,0) 66%),
      radial-gradient(ellipse 42% 30% at 67% 25%, rgba(92,58,10,0.5), rgba(0,0,0,0) 70%),
      radial-gradient(ellipse 52% 34% at 21% 75%, rgba(92,58,10,0.5), rgba(0,0,0,0) 70%),
      radial-gradient(ellipse 26% 52% at 50% 54%, rgba(255,240,190,0.5), rgba(0,0,0,0) 72%),
      conic-gradient(from 25deg at 34% 30%, #d9a93f, #f4dc86 12%, #b8862f 28%, #f7e9b0 44%,
                     #c69436 60%, #efd47a 76%, #a9762a 90%, #d9a93f);
  }
  [data-foil="silver"] {
    background:
      radial-gradient(ellipse 62% 46% at 26% 22%, rgba(255,255,255,0.95) , rgba(0,0,0,0) 62%),
      radial-gradient(ellipse 46% 34% at 73% 69%, rgba(236,242,248,0.5), rgba(0,0,0,0) 66%),
      radial-gradient(ellipse 42% 30% at 67% 25%, rgba(58,64,74,0.45), rgba(0,0,0,0) 70%),
      radial-gradient(ellipse 52% 34% at 21% 75%, rgba(58,64,74,0.45), rgba(0,0,0,0) 70%),
      radial-gradient(ellipse 26% 52% at 50% 54%, rgba(236,242,248,0.5), rgba(0,0,0,0) 72%),
      conic-gradient(from 25deg at 34% 30%, #b9bec7, #eef1f5 12%, #8e949e 28%, #ffffff 44%,
                     #a9aeb8 60%, #e2e7ee 76%, #7d838d 90%, #b9bec7);
  }
  /* 青金は、銀を多めに混ぜた淡い金。緑がかる */
  [data-foil="ao"] {
    background:
      radial-gradient(ellipse 62% 46% at 26% 22%, rgba(255,255,236,0.95), rgba(0,0,0,0) 62%),
      radial-gradient(ellipse 46% 34% at 73% 69%, rgba(238,236,192,0.55), rgba(0,0,0,0) 66%),
      radial-gradient(ellipse 42% 30% at 67% 25%, rgba(96,98,44,0.45), rgba(0,0,0,0) 70%),
      radial-gradient(ellipse 52% 34% at 21% 75%, rgba(96,98,44,0.4), rgba(0,0,0,0) 70%),
      conic-gradient(from 25deg at 34% 30%, #cfd08a, #eeecc0 12%, #b9bd78 28%, #f4f2cc 44%,
                     #c8cd84 60%, #e4e1a6 76%, #a8ad68 90%, #cfd08a);
  }
  /* 焼箔は、青・紫・茶がぬるりと移り変わる玉虫色 */
  [data-foil="yaki"] {
    background:
      radial-gradient(ellipse 62% 46% at 26% 22%, rgba(214,243,255,0.85), rgba(0,0,0,0) 62%),
      radial-gradient(ellipse 46% 34% at 73% 69%, rgba(142,90,134,0.55), rgba(0,0,0,0) 66%),
      radial-gradient(ellipse 42% 30% at 67% 25%, rgba(12,30,48,0.6), rgba(0,0,0,0) 70%),
      radial-gradient(ellipse 52% 34% at 21% 75%, rgba(12,30,48,0.55), rgba(0,0,0,0) 70%),
      conic-gradient(from 25deg at 34% 30%, #2f6f8e, #3f9aa0 14%, #54468a 30%, #8e5a86 46%,
                     #b5794a 60%, #7a5ea8 76%, #1f4a63 90%, #2f6f8e);
  }
  [data-foil="copper"] {
    background:
      radial-gradient(ellipse 62% 46% at 26% 22%, rgba(255,226,196,0.92) , rgba(0,0,0,0) 62%),
      radial-gradient(ellipse 46% 34% at 73% 69%, rgba(240,170,110,0.5), rgba(0,0,0,0) 66%),
      radial-gradient(ellipse 42% 30% at 67% 25%, rgba(74,30,6,0.5), rgba(0,0,0,0) 70%),
      radial-gradient(ellipse 52% 34% at 21% 75%, rgba(74,30,6,0.5), rgba(0,0,0,0) 70%),
      radial-gradient(ellipse 26% 52% at 50% 54%, rgba(240,170,110,0.5), rgba(0,0,0,0) 72%),
      conic-gradient(from 25deg at 34% 30%, #b25a26, #e59a55 12%, #8f4318 28%, #f0b276 44%,
                     #a8511f 60%, #d97a35 76%, #7d3a13 90%, #b25a26);
  }

  /* ===== 道具:線で描いた絵と名前 ===== */
  .tool svg { display: block; width: 24px; height: 24px; }
  .tool:active { color: #f0d878; }
  .tool:active svg { filter: drop-shadow(0 0 7px rgba(240,216,120,0.55)); }
  .swatch:active .foil { transform: scale(1.06); }

  .divider { width: 1px; height: 36px; margin-bottom: 8px; background: rgba(255,255,255,0.12); }

  /* ===== 枠付きのボタン(結果・記録の帳で使う) ===== */
  .btn {
    color: rgba(220,196,140,0.85);
    background: none; border: 1px solid rgba(220,196,140,0.3);
    border-radius: 4px;
    font-family: inherit; font-size: 12px; letter-spacing: 0.15em;
    padding: 7px 12px;
    white-space: nowrap;
    flex: 0 0 auto;
    cursor: pointer;
  }
  .btn:active { background: rgba(220,196,140,0.12); }

  /* ===== お題モード:上部の掲示(お題名と残りひと匙) ===== */
  #odai-hud {
    position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); left: 50%;
    transform: translateX(-50%);
    display: none;
    flex-direction: column; align-items: center; gap: 6px;
    pointer-events: none;
  }
  #odai-hud.show { display: flex; }
  #odai-name {
    color: rgba(230,205,140,0.9);
    font-size: 15px; letter-spacing: 0.25em;
    text-shadow: 0 0 10px rgba(201,162,75,0.3);
  }
  #odai-gauge {
    width: 140px; height: 5px;
    border: 1px solid rgba(230,205,140,0.35);
    border-radius: 3px;
    overflow: hidden;
  }
  #odai-gauge-fill {
    height: 100%; width: 100%;
    background: linear-gradient(to right, #c9a24b, #f0d878);
    transition: width 0.15s ease;
  }
  #odai-gauge-label {
    color: rgba(230,205,140,0.55);
    font-size: 11px; letter-spacing: 0.2em;
  }

  /* ===== お題モード:結果の掛け軸風パネル ===== */
  #result {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    /* left:50% だけだと、幅を決める余地が画面の右半分しか残らない
       (transform は描画位置をずらすだけで、幅の計算には効かない)。
       内容ぶんの幅を取り、画面からはみ出さないところで止める。
       padding を幅に含めるため box-sizing も要る */
    box-sizing: border-box;
    width: max-content;
    max-width: min(360px, calc(100vw - 32px));
    display: none;
    flex-direction: column; align-items: center; gap: 14px;
    padding: 28px 36px;
    background: rgba(14,10,6,0.92);
    border: 1px solid rgba(201,162,75,0.4);
    border-radius: 6px;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
  }
  #result.show { display: flex; }
  #result-rank {
    color: #f0d878;
    font-size: 34px; letter-spacing: 0.3em;
    text-shadow: 0 0 16px rgba(240,216,120,0.35);
  }
  #result-detail {
    color: rgba(230,210,170,0.75);
    font-size: 13px; letter-spacing: 0.12em;
  }
  #result-word {
    color: rgba(230,210,170,0.55);
    font-size: 12px; letter-spacing: 0.15em;
  }
  #result-buttons { display: flex; gap: 10px; margin-top: 4px; flex-wrap: wrap; justify-content: center; }
  #result-note {
    color: #e6cd8c;
    font-size: 12px; letter-spacing: 0.12em;
  }
  #result-limit {
    color: rgba(230,210,170,0.45);
    font-size: 11px; letter-spacing: 0.1em;
    margin-top: -8px;
  }

  /* お題の難易度 */
  #odai-level {
    color: rgba(230,205,140,0.7);
    font-size: 11px; letter-spacing: 0.3em;
  }

  /* ===== 記録の帳 ===== */
  #book {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    box-sizing: border-box;
    width: max-content;
    max-width: min(360px, calc(100vw - 32px));
    max-height: calc(100vh - 80px);
    overflow-y: auto;
    display: none;
    flex-direction: column; align-items: center; gap: 12px;
    padding: 24px 28px;
    background: rgba(8,8,8,0.95);
    border: 1px solid rgba(201,162,75,0.4);
    border-radius: 6px;
    box-shadow: 0 0 40px rgba(0,0,0,0.7);
  }
  #book.show { display: flex; }
  #book-grade {
    color: #f0d878;
    font-size: 26px; letter-spacing: 0.3em;
    text-shadow: 0 0 16px rgba(240,216,120,0.35);
  }
  #book-summary {
    color: rgba(230,210,170,0.7);
    font-size: 12px; letter-spacing: 0.1em; text-align: center;
  }
  #book-table {
    border-collapse: collapse;
    color: rgba(230,210,170,0.8);
    font-size: 12px; letter-spacing: 0.08em;
  }
  #book-table td { padding: 4px 8px; white-space: nowrap; }
  #book-table td.name { color: rgba(230,205,140,0.95); }
  #book-table td.rank-名人 { color: #f0d878; }
  #book-table td.rank-まだ { color: rgba(200,190,170,0.35); }
  #book-table tr[data-shape] { cursor: pointer; }
  #book-table tr[data-shape]:active td { color: #f0d878; }
  #book-hint {
    color: rgba(230,210,170,0.4);
    font-size: 11px; letter-spacing: 0.1em;
  }
  #book-buttons { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }


  /* 写したときの知らせ */
  #toast {
    position: fixed; left: 50%; bottom: 76px;
    transform: translateX(-50%);
    box-sizing: border-box;
    max-width: calc(100vw - 32px);
    padding: 8px 16px;
    background: rgba(8,8,8,0.9);
    border: 1px solid rgba(201,162,75,0.35);
    border-radius: 4px;
    color: rgba(230,210,170,0.9);
    font-size: 12px; letter-spacing: 0.12em;
    white-space: nowrap;
    opacity: 0; transition: opacity 0.3s ease;
    pointer-events: none;
  }
  #toast.show { opacity: 1; }

  /* ===== タイトル画面 =====
     題字ごと描かれた一枚絵を敷き、その上から金箔を降らせる。
     遊ぶ画面は真っ黒に保ちたいので、雰囲気づくりはここに寄せる */
  #title-screen {
    /* fixed は「割合の高さ」で止まる。根っこ(vh)の中に置く */
    position: absolute; inset: 0;
    z-index: 50;
    display: flex; align-items: flex-end; justify-content: center;
    background: #000000;          /* 絵が届くまでの下地 */
    transition: opacity 0.5s ease;
  }
  /* 題字ごと一枚絵。縦横比が端末と違うので、はみ出すぶんは切って画面を埋める */
  #title-art {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; object-position: center;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  #title-screen.gone { opacity: 0; pointer-events: none; }
  #title-screen.off  { display: none; }
  #titlecv { position: absolute; inset: 0; }

  /* 案内は、絵の題字と水面のあいだの暗いところへ置く。
     下端に置くと、光る水面に重なって読めなくなる */
  #title-inner {
    position: absolute; top: 75%; left: 0; right: 0;
    display: flex; flex-direction: column; align-items: center;
    padding: 0 16px;
    pointer-events: none;          /* 触れたら始まる。文字が邪魔をしない */
    text-align: center;
  }
  #title-start {
    color: rgba(240,224,186,0.72);
    font-size: 12px; letter-spacing: 0.3em;

<script src="./core.js"></script>
<script>
"use strict";

const Core = window.KinpakuCore;

/* ============================================================
   金箔散らし
   - タップ / なぞりで金箔が舞い散り、少し落ちた先で貼り付く
   - 落下中は箔が回転し、光を受けてきらめく
   - 貼り付いた箔は「沈殿レイヤー」(オフスクリーンCanvas)に
     焼き込むため、何万枚積もっても描画負荷は一定
   ============================================================ */

const cv  = document.getElementById("cv");
const ctx = cv.getContext("2d");

/* 沈殿レイヤー:貼り付いた箔を焼き込む先 */
const sedCv  = document.createElement("canvas");
const sedCtx = sedCv.getContext("2d");

/* 記録から溢れたぶんを焼き付けておく下地。
   指でずらすときは沈殿レイヤーを記録から描き直すので、記録を落とした箔が
   消えてしまわないよう、落とす前にここへ写しておく。
   resize() が触るので、沈殿レイヤーと同じところで用意する */
const baseCv  = document.createElement("canvas");
const baseCtx = baseCv.getContext("2d");


let W = 0, H = 0, DPR = 1;

/* ----- 端末解像度に合わせてCanvasを設定(リサイズ時は積もった箔を引き継ぐ) ----- */
/* ホームバーとの重なりを測って、下の余白を決める。
   ウェブ画面の下端 (画面上での位置 + 高さ) が、ホームバーの上端より
   下まで来ているときだけ、その重なりぶんを空ける */
function 下の余白を決める() {
  const 測り = document.createElement("div");
  測り.style.cssText =
    "position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;" +
    "padding-bottom:env(safe-area-inset-bottom);";
  document.body.appendChild(測り);
  const 安全域下 = Math.round(parseFloat(getComputedStyle(測り).paddingBottom) || 0);
  測り.remove();
  const 端末の高さ = window.innerHeight > window.innerWidth
    ? Math.max(screen.width, screen.height)
    : Math.min(screen.width, screen.height);
  const 画面の下端 = Math.round((window.screenY || 0) + 画面の高さ());
  const 余白 = Core.bottomGap(画面の下端, 端末の高さ, 安全域下);
  document.documentElement.style.setProperty("--下の余白", 余白 + "px");
  return 余白;
}

/* 画面の高さ。渡された高さが足りないときのために、100vh も測って
   大きい方を使う(実機で innerHeight 873 / 100vh 932 になることがあった) */
function 画面の高さ() {
  const 箱 = document.createElement("div");
  箱.style.cssText = "position:absolute;left:0;top:0;width:0;height:100vh;visibility:hidden;";
  document.body.appendChild(箱);
  const h = Math.round(箱.getBoundingClientRect().height);
  箱.remove();
  return Math.max(window.innerHeight, h || 0);
}

function resize() {
  下の余白を決める();
  const oldW = sedCv.width, oldH = sedCv.height;
  let old = null;
  if (oldW > 0 && oldH > 0) {
    /* 既存の沈殿レイヤーを一時退避 */
    old = document.createElement("canvas");
    old.width = oldW; old.height = oldH;
    old.getContext("2d").drawImage(sedCv, 0, 0);
  }
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = 画面の高さ();
  cv.width  = W * DPR; cv.height  = H * DPR;
  cv.style.width = W + "px"; cv.style.height = H + "px";
  sedCv.width = W * DPR; sedCv.height = H * DPR;
  baseCv.width = W * DPR; baseCv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  sedCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
  baseCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (old) sedCtx.drawImage(old, 0, 0, oldW / DPR, oldH / DPR); /* 論理座標系で貼り直し */
}
window.addEventListener("resize", resize);
resize();

/* ============================================================
   色定義:金・銀・赤金の三種。base=箔の地色、glint=きらめきの色
   ============================================================ */
const PALETTES = {
  gold:   { base: ["#e8c15a", "#d4a944", "#c69436", "#f0d878", "#b8862f"], glint: "#fff6d5" },
  silver: { base: ["#d9dde3", "#b9bec7", "#eef1f5", "#a9aeb8", "#c8cdd5"], glint: "#ffffff" },
  copper: { base: ["#c9722f", "#b25a26", "#e08a3c", "#d97a35", "#9c4a1e"], glint: "#ffd9b0" },
  /* 青金:銀を多めに混ぜた金。緑がかった淡い金になる */
  ao:     { base: ["#e4e1a6", "#d6d692", "#eeecc0", "#c8cd84", "#dfe0b0"], glint: "#fbffe4" },
  /* 焼箔:銀箔などに熱や硫黄をかけて色を出したもの。一枚ごとに青・紫・
     茶・玉虫と出方が違うので、地色の候補を散らして混ぜる。
     さらに1枚の中でも色が移るよう、二色の組を持たせる(下の 焼箔の勾配) */
  yaki:   { base: ["#2f6f8e", "#7a5ea8", "#b5794a", "#3f9aa0", "#54468a", "#8e5a86"], glint: "#d6f3ff" },
};

/* 焼箔の、1枚の中での色の移り。実物も熱のかけ方で縁と中で色が変わる。
   箔1枚ごとに勾配を作ると重いので、箔の向きに合わせた「その場の座標」で
   あらかじめ作っておき、使い回す(塗る前に translate/rotate しているので、
   勾配も箔と一緒に回る) */
/* 組にするのは、色の輪の上で隣り合う色どうし。離れた色を混ぜると
   中間で色が抜け、実測で彩度が 0.397 → 0.295、濃い色の割合が
   37% → 14% まで落ちた */
const YAKI_PAIRS = [
  ["#3f9aa0", "#2f6f8e"],   /* 青緑 → 青 */
  ["#2f6f8e", "#54468a"],   /* 青 → 藍 */
  ["#54468a", "#7a5ea8"],   /* 藍 → 紫 */
  ["#7a5ea8", "#8e5a86"],   /* 紫 → 葡萄 */
  ["#8e5a86", "#b5794a"],   /* 葡萄 → 茶 */
  ["#b5794a", "#8a6f3a"],   /* 茶 → 金茶 */
];
/* 大きさごとに作り分ける。ひとつの勾配を使い回すと、小さい砂子は
   二色の「中間あたり」しか拾わず、色が浅く濁って見えた */
const YAKI_SIZES = [2, 4, 7, 11, 15];
const 勾配の棚 = new WeakMap();

function 焼箔の勾配(c, i, size) {
  let 棚 = 勾配の棚.get(c);
  if (!棚) { 棚 = []; 勾配の棚.set(c, 棚); }
  /* 大きさをいちばん近い段に丸める */
  let 段 = 0;
  for (let k = 1; k < YAKI_SIZES.length; k++) {
    if (Math.abs(YAKI_SIZES[k] - size) < Math.abs(YAKI_SIZES[段] - size)) 段 = k;
  }
  const 番 = (i % YAKI_PAIRS.length) * YAKI_SIZES.length + 段;
  if (!棚[番]) {
    const [a, b] = YAKI_PAIRS[i % YAKI_PAIRS.length];
    const r = YAKI_SIZES[段];
    const g = c.createLinearGradient(-r, -r, r, r);
    /* 端は色を残したまま、真ん中だけで移す。全体を通して混ぜると、
       箔のほとんどが中間色になって濁る */
    g.addColorStop(0, a);
    g.addColorStop(0.38, a);
    g.addColorStop(0.62, b);
    g.addColorStop(1, b);
    棚[番] = g;
  }
  return 棚[番];
}
let currentPalette = "gold";

/* ============================================================
   舞っている箔(落下中のパーティクル)
   ============================================================ */
const flakes = [];
const MAX_FLAKES = 600;   /* 同時に舞える箔の上限(端末負荷対策) */

/* 撒いた場所から、どれだけ下に落ちてから貼り付くか。
   お題の「このへんから蒔く」の帯も、この2つから引くので出どころは一つ */
const SETTLE_MIN = 60, SETTLE_SPAN = 220;

/* 箔一枚を生成:不定形の四角形として頂点を持たせる
   大きさは蒔絵の配合に倣った3階層:
   ・砂子(すなご) …ごく細かい粉。全体の約8割
   ・中粒          …小さな箔片。約2割
   ・大判          …ひと摘みだけ混ざる大きな箔(長押しでも出る) */
function makeFlake(x, y, big) {
  let size, grade;
  const roll = Math.random();
  if (big || roll > 0.98) {          /* 大判:2% */
    grade = 2;
    size = 6 + Math.random() * 5;
  } else if (roll > 0.78) {          /* 中粒:20% */
    grade = 1;
    size = 3 + Math.random() * 2.2;
  } else {                           /* 砂子:78% */
    grade = 0;
    size = 1.2 + Math.random() * 1.2;
  }
  /* 金箔片らしい角ばった不定形の頂点(4点) */
  const verts = [];
  for (let i = 0; i < 4; i++) {
    const a = (Math.PI / 2) * i + (Math.random() - 0.5) * 0.7;
    const r = size * (0.6 + Math.random() * 0.5);
    verts.push([Math.cos(a) * r, Math.sin(a) * r]);
  }
  const colors = PALETTES[currentPalette].base;
  return {
    x, y,
    grade, size,
    vx: (Math.random() - 0.5) * 1.6,        /* 横方向の初速 */
    vy: -Math.random() * 0.7 - 0.1,          /* ほんの少し舞い上がってから落ちる */
    pvx: 0, pvy: 0,                          /* 指から弾ける勢い(すぐ減る) */
    rot: Math.random() * Math.PI * 2,        /* 面内回転 */
    vr: (Math.random() - 0.5) * (grade === 2 ? 0.06 : 0.12),  /* 大判はゆったり回る */
    facePhase: Math.random() * Math.PI * 2,  /* 表裏の傾き(きらめき用の位相) */
    faceRate: (grade === 0 ? 0.08 : 0.05) + Math.random() * 0.08,  /* 砂子は忙しなくひらめく */
    swayPhase: Math.random() * Math.PI * 2,  /* 左右の揺らぎの位相 */
    swayAmp: (grade === 0 ? 0.45 : 0.25) + Math.random() * 0.5,    /* 軽い粉ほどよく漂う */
    verts,
    color: colors[(Math.random() * colors.length) | 0],
    /* 焼箔だけ、1枚の中で色が移る。どの組で移るかは1枚ごとに引く */
    gi: currentPalette === "yaki" ? (Math.random() * YAKI_PAIRS.length) | 0 : -1,
    glint: PALETTES[currentPalette].glint,
    settleY: y + SETTLE_MIN + Math.random() * SETTLE_SPAN,   /* この高さまで落ちたら貼り付く */
  };
}

/* ============================================================
   貼り付いた箔の記録:きらめき演出の抽選用(描画自体は焼き込み済み)
   ============================================================ */
const settled = [];
const MAX_SETTLED_RECORDS = 5000;

/* 記録1枚を、指定のコンテキストへ描く(最初の焼き込みも描き直しも同じ道を通る) */
function paintSettled(c, r) {
  c.save();
  c.translate(r.x, r.y);
  c.rotate(r.rot);
  if (r.flipped) {
    /* 裏面:光を返さない暗い箔。艶消しの陰が金属らしさを生む */
    c.globalAlpha = 0.85;
    c.fillStyle = r.color;
    drawPoly(c, r.verts, 1);
  } else {
    /* 表面:明度の個体差を広めに取り、平坦さをなくす */
    c.globalAlpha = r.bright;
    c.fillStyle = r.gi >= 0 ? 焼箔の勾配(c, r.gi, r.size) : r.color;
    drawPoly(c, r.verts, 1);
    /* ごく薄い縁のハイライトで箔の厚みを表現 */
    c.globalAlpha = r.bright * 0.35;
    c.strokeStyle = r.glint;
    c.lineWidth = 0.5;
    c.stroke();
  }
  c.restore();
}

/* 沈殿レイヤーを、下地 + いまの記録から描き直す */
function rebuildSediment() {
  sedCtx.save();
  sedCtx.setTransform(1, 0, 0, 1, 0, 0);
  sedCtx.clearRect(0, 0, sedCv.width, sedCv.height);
  sedCtx.drawImage(baseCv, 0, 0);
  sedCtx.restore();
  for (const r of settled) paintSettled(sedCtx, r);
}

/* 箔を沈殿レイヤーに焼き込む(=漆に貼り付く) */
function stampFlake(f) {
  const flipped = Math.random() < 0.08;   /* 約8%は裏返って貼り付く */
  const rec = {
    x: f.x, y: f.y, size: f.size + 2, glint: f.glint,
    /* ずらすときに姿を復元するための情報 */
    verts: f.verts, rot: f.rot, gi: f.gi,
    flipped, bright: 0.55 + Math.random() * 0.45,
    color: flipped ? shadeColor(f.color, 0.45) : f.color,
  };
  paintSettled(sedCtx, rec);
  settled.push(rec);
  if (settled.length > MAX_SETTLED_RECORDS) {
    /* 記録から落とすぶんは、消えないよう下地へ焼き付けてから捨てる */
    paintSettled(baseCtx, settled.shift());
  }

  /* お題モード:この箔が型の内か外かを記録 */
  odaiRecord(f);

  /* 着地の余韻:ぺたっと定着した瞬間、小さくきらっと光る
     (表向きの箔だけ。大きい箔ほど少し強く光る) */
  if (!flipped && !reduceMotion) {
    sparkles.push({
      x: f.x, y: f.y, glint: f.glint,
      t: 0, dur: 0.25 + Math.random() * 0.15,
      scale: 0.35 + f.size * 0.07,    /* 常時きらめきより控えめに */
    });
  }
}

/* 色を暗くするユーティリティ("#rrggbb" を係数で減光) */
function shadeColor(hex, k) {
  const r = (parseInt(hex.slice(1, 3), 16) * k) | 0;
  const g = (parseInt(hex.slice(3, 5), 16) * k) | 0;
  const b = (parseInt(hex.slice(5, 7), 16) * k) | 0;
  return `rgb(${r},${g},${b})`;
}

/* 頂点列からポリゴンを描く(yScaleでひらひらの傾きを表現) */
function drawPoly(c, verts, yScale) {
  c.beginPath();
  c.moveTo(verts[0][0], verts[0][1] * yScale);
  for (let i = 1; i < verts.length; i++) c.lineTo(verts[i][0], verts[i][1] * yScale);
  c.closePath();
  c.fill();
}

/* ============================================================
   きらめき:貼り付いた箔が時々ちらっと光る(蒔絵の艶)
   ============================================================ */
const sparkles = [];
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let sparkleTimer = 0;

function updateSparkles(dt) {
  sparkleTimer -= dt;
  /* 一定間隔で、積もった箔の中からランダムに光らせる */
  if (sparkleTimer <= 0 && settled.length > 0 && !reduceMotion) {
    sparkleTimer = 0.18 + Math.random() * 0.25;
    const n = Math.min(1 + (settled.length / 800 | 0), 3);
    for (let i = 0; i < n; i++) {
      const s = settled[(Math.random() * settled.length) | 0];
      sparkles.push({ x: s.x, y: s.y, glint: s.glint, t: 0, dur: 0.5 + Math.random() * 0.4, scale: 1 });
    }
  }
  for (let i = sparkles.length - 1; i >= 0; i--) {
    sparkles[i].t += dt;
    if (sparkles[i].t > sparkles[i].dur) sparkles.splice(i, 1);
  }
}

function drawSparkles() {
  ctx.save();
  ctx.globalCompositeOperation = "lighter";  /* 加算合成で光らせる */
  for (const s of sparkles) {
    const p = s.t / s.dur;
    const a = Math.sin(p * Math.PI);          /* ふわっと明滅 */
    const r = (3 + a * 5) * (s.scale || 1);
    /* 中心の光 */
    const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, r);
    g.addColorStop(0, s.glint);
    g.addColorStop(1, "rgba(255,240,190,0)");
    ctx.globalAlpha = a * 0.8;
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, Math.PI * 2); ctx.fill();
    /* 十字の光条 */
    ctx.globalAlpha = a * 0.6;
    ctx.strokeStyle = s.glint;
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(s.x - r * 1.6, s.y); ctx.lineTo(s.x + r * 1.6, s.y);
    ctx.moveTo(s.x, s.y - r * 1.6); ctx.lineTo(s.x, s.y + r * 1.6);
    ctx.stroke();
  }
  ctx.restore();
}

/* ============================================================
   入力:タップで一振り、長押し・なぞりで撒き続ける
   ============================================================ */
/* 指がいまやること。速さで見分けると「ゆっくり押しやりたい」が蒔きに
   なってしまうので、下の帯で選ぶ。速い払いは蒔くモードの近道として残す */
let 手 = "蒔く";     /* 蒔く | ずらす | 消す */

const pointer = { down: false, x: 0, y: 0, holdTime: 0 };
const hint = document.getElementById("hint");
let touched = false;

/* 案内文を消す。キャンバスに触れたときだけでなく、
   お題に入ったときにも消す(型の上に文字が乗ってしまうため) */
function hideHint() {
  if (touched) return;
  touched = true;
  hint.classList.add("hidden");
}

/* フリック判定用:直近の指の軌跡(約100ms分)を覚えておく */
const trail = [];
const FLICK_SPEED = 2200;   /* これより速くなでると「ずらす」(px/秒)。速めのなぞりは撒き扱い */

function pushTrail(x, y) {
  const t = performance.now();
  trail.push({ x, y, t });
  while (trail.length > 0 && t - trail[0].t > 100) trail.shift();
}

/* ============================================================
   撒いたときの手触り
   ------------------------------------------------------------
   もとは指のところに固まりが湧いて、0.5秒ほどその場に浮いてから
   ゆっくり落ちていた。1フレームずつ測ると、最初の500msで
   いちばん下の箔が 11px しか動いていなかった。
   ・指から外へ散らす勢いを足して、触った瞬間に広がるようにする
   ・浮いている時間を縮める(上向きの初速を弱め、重力を強める)
   ・落ちる速さの上限は変えない。ひらひらはこのアプリの味なので残す
   ============================================================ */
const GRAVITY = 3.4;        /* 重力。2.2 だと上向きの初速を消すのに 0.6 秒かかっていた */
const SPREAD_X = 32;        /* 生まれる位置の散らばり(横) */
const SPREAD_Y = 22;        /* 同(縦) */
const POP = 4.0;            /* 指から外へ弾ける勢い(1フレームあたりpx) */
const POP_DECAY = 0.88;     /* 弾ける勢いの減り方。ふつうの空気抵抗(0.985)だと
                               勢いが残り続け、2秒で 352px も広がってしまった。
                               0.88 なら 0.3 秒ほどで収まり、散り幅は 12〜42px */

function emitBurst(x, y, count, big) {
  for (let i = 0; i < count; i++) {
    /* お題モード中は匙の残りが尽きたら撒けない */
    if (odai.active && !odai.result) {
      if (odai.budget <= 0) return;
      odai.budget--;
      hudFill.style.width = (odai.budget / odai.budgetMax * 100) + "%";
    } else if (odai.active && odai.result) {
      return;   /* 結果表示中は撒けない */
    }
    if (flakes.length >= MAX_FLAKES) flakes.shift();  /* 上限超過時は古い箔を破棄 */
    const ox = (Math.random() - 0.5) * SPREAD_X;
    const oy = (Math.random() - 0.5) * SPREAD_Y;
    const f = makeFlake(x + ox, y + oy, big);
    /* 指を中心に、外へ向かってぱっと散る。
       軽い砂子ほど遠くまで飛び、大判はあまり動かない */
    const d = Math.hypot(ox, oy) || 1;
    const 軽さ = f.grade === 0 ? 1.15 : (f.grade === 1 ? 0.85 : 0.55);
    const push = POP * (0.35 + Math.random() * 0.9) * 軽さ;
    /* 漂う速さとは別に持たせる。すぐ減るので、散ったあとは
       もとどおりのひらひらに戻る */
    f.pvx = (ox / d) * push;
    f.pvy = (oy / d) * push * 0.5;          /* 縦は控えめ。上へ飛びすぎない */
    flakes.push(f);
  }
}

/* ずらす・消すは、指の通り道ぜんぶに効かせる。ただし1回ごとに沈殿レイヤーを
   描き直すので、動くたびに呼ぶと重い。少し進むか、少し時間が経つまで溜める */
const 手の歩幅 = 13;        /* 消すとき、この距離だけ動いたら1回効かせる(px) */
const 手の間隔 = 55;        /* または、この時間が経ったら(ミリ秒) */
const 寄せる歩幅 = 2;       /* 寄せるときは、指について来ないと意味がないので細かく */
const 手の道 = [];          /* 溜めている通り道 */
let 手の時 = 0;

function 手を始める(x, y) {
  手の道.length = 0;
  手の道.push({ x, y });
  手の時 = performance.now();
}

function 手を進める(x, y) {
  const 前 = 手の道[手の道.length - 1];
  const 進み = 前 ? Math.hypot(x - 前.x, y - 前.y) : 0;
  手の道.push({ x, y });
  const 経過 = performance.now() - 手の時;
  if (手 === "ずらす") {
    if (進み < 寄せる歩幅) return;                    /* 止まっていたら寄せるものが無い */
    手を効かせる();
    return;
  }
  if (手の道.length >= 2 && (進み >= 手の歩幅 || 経過 >= 手の間隔)) 手を効かせる();
}

function 手を効かせる() {
  if (手の道.length < 2) return;
  const a = 手の道[0], b = 手の道[手の道.length - 1];
  if (手 === "ずらす") bladePush(手の道.slice());
  else if (手 === "消す") erasePath(手の道.slice());
  /* 次のひと筆は、いまの指先から続ける */
  手の道.length = 0;
  手の道.push({ x: b.x, y: b.y });
  手の時 = performance.now();
}

function onDown(x, y) {
  pointer.down = true; pointer.x = x; pointer.y = y; pointer.holdTime = 0;
  trail.length = 0;
  pushTrail(x, y);
  if (手 === "蒔く") {
    emitBurst(x, y, 20, false);     /* タップの瞬間にぱっとひと振り(砂子中心なので多めに) */
  } else {
    手を始める(x, y);
    if (手 === "消す") erasePath([{ x, y }, { x: x + 0.01, y }]);   /* 触れた所はすぐ消える */
  }
  hideHint();
}
function onMove(x, y) {
  if (!pointer.down) return;
  pushTrail(x, y);
  if (手 !== "蒔く") {
    手を進める(x, y);
    pointer.x = x; pointer.y = y;
    return;
  }
  /* なぞった軌跡に沿って撒く */
  const dx = x - pointer.x, dy = y - pointer.y;
  const dist = Math.hypot(dx, dy);
  const steps = Math.max(1, Math.min((dist / 14) | 0, 6));
  for (let i = 1; i <= steps; i++) {
    emitBurst(pointer.x + dx * i / steps, pointer.y + dy * i / steps, 3, false);
  }
  pointer.x = x; pointer.y = y;
}
function onUp() {
  if (!pointer.down) return;
  pointer.down = false;
  if (手 !== "蒔く") {
    手を効かせる();          /* 溜めていたぶんを最後に効かせる */
    手の道.length = 0;
    trail.length = 0;
    return;
  }
  /* フリック判定:直近の軌跡から離した瞬間の速度を求める */
  if (trail.length >= 2) {
    const a = trail[0], b = trail[trail.length - 1];
    const dtms = b.t - a.t;
    if (dtms > 15) {
      const vx = (b.x - a.x) / dtms * 1000;   /* px/秒 */
      const vy = (b.y - a.y) / dtms * 1000;
      if (Math.hypot(vx, vy) >= FLICK_SPEED) {
        if (odai.active) {
          /* お題中は採点が絡むので、ずらさずに同じ型でやり直し */
          resetRound();
          washAway();
        } else {
          /* 払った!→ 指のそばの箔だけを、その向きへすべらせる */
          slidePush(trail.slice(), b.x - a.x, b.y - a.y);
        }
      }
    }
  }
  trail.length = 0;
}

/* ポインターイベント(マウス・タッチ共通)
   押した指は setPointerCapture で捕まえておく。捕まえないと、指が下部の
   操作帯に載った瞬間 pointermove が canvas へ来なくなり、pointer.down だけ
   true のまま「最後に canvas で見た位置」へ撒き続けてしまう */
cv.addEventListener("pointerdown", e => {
  e.preventDefault();
  try { cv.setPointerCapture(e.pointerId); } catch (_) { /* 捕まえられなくても動く */ }
  onDown(e.clientX, e.clientY);
});
cv.addEventListener("pointermove", e => { e.preventDefault(); onMove(e.clientX, e.clientY); });
window.addEventListener("pointerup", onUp);
window.addEventListener("pointercancel", onUp);

/* ============================================================
   場面転換:お題の開始時に、画面を下へ洗い流して切り替える
   ============================================================ */
let washing = null;  /* { t } 洗い流しアニメーション中の状態 */

/* 洗い流し処理本体(お題のやり直しでも使う) */
function washAway() {
  if (washing) return;
  if (settled.length === 0 && flakes.length === 0) {
    flakes.length = 0;
    return;
  }
  /* 現在の沈殿レイヤーを退避して、流れ落ちる演出に使う */
  const snap = document.createElement("canvas");
  snap.width = sedCv.width; snap.height = sedCv.height;
  snap.getContext("2d").drawImage(sedCv, 0, 0);
  washing = { t: 0, snap };
  /* 本体は即クリア(以降の新しい箔は普通に積もれる) */
  sedCtx.clearRect(0, 0, W, H);
  settled.length = 0;
  sparkles.length = 0;
  flakes.length = 0;
}

/* ============================================================
   ずらす:指で払った「その場所の箔だけ」を、なぞった向きへ動かす
   ------------------------------------------------------------
   もとは画面じゅうの箔をいっせいに舞い上げて飛ばしていたが、
   それでは細かい直しに使えない。指の通り道のそばにある箔だけを
   拾い上げ、すべらせて、少し先に置き直す。手で蒔絵をならす感じ。

   ・指から遠いほど動かない(通り道からの距離でなだらかに弱まる)
   ・動く距離は指の動いた量に比例する。ゆっくり払えば少しだけ動く
   ・画面の外へは飛ばさない。必ずどこかに落ち着く
   ============================================================ */
const sliding = [];            /* すべっている最中の箔 */
const PUSH_RADIUS = 78;        /* 指の通り道から、この距離までが動く(px) */
const PUSH_MAX = 130;          /* いちばん強いときでも、これ以上は動かさない(px) */
const PUSH_DUR = 0.28;         /* すべっている時間(秒) */

/* 点と線分の距離 */
function distToSegment(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const len2 = dx * dx + dy * dy;
  if (len2 === 0) return Math.hypot(px - ax, py - ay);
  let t = ((px - ax) * dx + (py - ay) * dy) / len2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (ax + dx * t), py - (ay + dy * t));
}

/* 指の通り道(点列)からの、いちばん近い距離 */
function distToPath(px, py, path) {
  let d = Infinity;
  for (let i = 1; i < path.length; i++) {
    d = Math.min(d, distToSegment(px, py, path[i - 1].x, path[i - 1].y, path[i].x, path[i].y));
    if (d === 0) break;
  }
  return d;
}

/* ============================================================
   通り道のまわりだけを描き直す
   ------------------------------------------------------------
   ずらす・消すのたびに沈殿レイヤーを全部描き直していたら、記録が
   2000枚たまった状態で 1コマ 83ms (CPU4倍遅で12fps)。触った所だけ
   切り抜いて、そこに関わる記録だけ塗り直せば、枚数によらず軽い。
   ============================================================ */
function 通り道の形(path, r) {
  const 道 = new Path2D();
  let 前 = null;
  for (const p of path) {
    /* 点が細かすぎると円を何十個も置くことになる。半径の半分ずつに間引く */
    if (前 && Math.hypot(p.x - 前.x, p.y - 前.y) < r * 0.5) continue;
    道.moveTo(p.x + r, p.y);
    道.arc(p.x, p.y, r, 0, Math.PI * 2);
    前 = p;
  }
  const 終 = path[path.length - 1];
  道.moveTo(終.x + r, 終.y);
  道.arc(終.x, 終.y, r, 0, Math.PI * 2);
  return 道;
}

/* 通り道を囲う四角。消す・戻すを画面ぜんぶに掛けると、積もりが増えたとき
   1コマ 116ms まで跳ねた。触った所の外は触らない */
function 通り道の囲い(path, r) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const p of path) {
    x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y);
    x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y);
  }
  return {
    x: Math.max(0, x0 - r), y: Math.max(0, y0 - r),
    w: Math.min(W, x1 + r) - Math.max(0, x0 - r),
    h: Math.min(H, y1 + r) - Math.max(0, y0 - r),
  };
}

/* 切り抜いた中を一度まっさらにして、そこに残るものだけ置き直す。
   下地(記録から溢れて焼き付けたぶん)を戻すかどうかは、用で変わる */
function 通り道を描き直す(道, 囲い, 残る記録, 下地を戻す) {
  if (囲い.w <= 0 || 囲い.h <= 0) return;
  sedCtx.save();
  sedCtx.clip(道);
  sedCtx.clearRect(囲い.x, 囲い.y, 囲い.w, 囲い.h);
  if (下地を戻す) {
    sedCtx.drawImage(baseCv,
      囲い.x * DPR, 囲い.y * DPR, 囲い.w * DPR, 囲い.h * DPR,
      囲い.x, 囲い.y, 囲い.w, 囲い.h);
  }
  sedCtx.restore();
  for (const r of 残る記録) paintSettled(sedCtx, r);
}

/* ============================================================
   寄せる:指を「へら」と見て、通った跡の箔を前へ押し出す
   ------------------------------------------------------------
   はじめは、そばの箔に「指の動いたぶん × 距離の重み」を与えて
   すべらせていた。これだと実機で2つ困ったことが起きた:

   ・弧が何本も残って波のように見える
     すべっている最中の箔は記録から外れているので、次のひと押しが
     当たらない。押された場所に置き去りになって、押すたびに弧が1本ずつ
     積み重なっていた
   ・なぞった後ろに箔が残る
     1回のひと押しで動くのは「そのあいだに指が進んだぶん(13px ほど)」
     だけなので、指について来ない

   そこで、指の下に半径 BLADE_R の円(へら)があると考えて、
   その円に入った箔を「円の前ふちまで」押し出す。押した先は記録に
   すぐ書き戻すので、次のひと押しでも続けて押される。指について来て、
   通った後ろは空になる。
   ============================================================ */
const BLADE_R = 62;            /* 指の下のへらの半径(px) */

function bladePush(path) {
  if (path.length < 2) return 0;
  const a = path[0], b = path[path.length - 1];
  const dx = b.x - a.x, dy = b.y - a.y;
  const len = Math.hypot(dx, dy);
  if (len < 0.3) return 0;
  const ux = dx / len, uy = dy / len;        /* 進む向き */
  const vx = -uy, vy = ux;                   /* その直角 */

  let 動いた = 0;
  for (const r of settled) {
    const ox = r.x - b.x, oy = r.y - b.y;
    const along = ox * ux + oy * uy;         /* 指の前後 (+ が前) */
    const perp  = ox * vx + oy * vy;         /* 指の左右 */
    if (Math.abs(perp) >= BLADE_R) continue;
    /* へらの前ふち。真ん中ほど遠くまで、端ほど動かない(自然に羽根が立つ) */
    const 前ふち = Math.sqrt(BLADE_R * BLADE_R - perp * perp);
    if (along >= 前ふち) continue;                    /* すでに前にいる */
    if (along < -(len + BLADE_R)) continue;           /* 今回の通り道より後ろ */
    /* 前ふちのすぐ内側へ。一列に揃うと壁に見えるので、少し散らす */
    const 置く = 前ふち - Math.random() * BLADE_R * 0.35;
    /* 横へ少しずつ逃がす。逃がさないと、寄せた山がへらの前に溜まり続け、
       毎回その山ぜんぶを描き直すことになる(実測で 935枚→2553枚、
       1回 22ms→35ms と重くなっていった)。雪かきと同じで、端から
       こぼれて筋の両脇に土手ができる */
    const 逃げ = perp * 0.04;
    const よれ = (Math.random() - 0.5) * 5;
    const 横 = perp + 逃げ + よれ;
    r.x = b.x + ux * 置く + vx * 横;
    r.y = b.y + uy * 置く + vy * 横;
    r.x = Math.max(2, Math.min(W - 2, r.x));
    r.y = Math.max(2, Math.min(H - 2, r.y));
    r.rot += (Math.random() - 0.5) * 0.3;
    動いた++;
  }
  if (動いた === 0) return 0;

  /* 動かした所だけ描き直す。押し出し先はへらの円の中なので、
     通り道を少し太めに取れば、元いた所も行き先も収まる */
  const 道 = 通り道の形(path, BLADE_R + 16);
  通り道を描き直す(道, 通り道の囲い(path, BLADE_R + 18),
    settled.filter((r) => distToPath(r.x, r.y, path) < BLADE_R + 30), true);
  sparkles.length = 0;
  return 動いた;
}

/* 払った:通り道のそばの箔を拾って、なぞった向きへすべらせる */
function slidePush(path, dx, dy) {
  const travel = Math.hypot(dx, dy);
  if (travel < 1) return 0;
  const ux = dx / travel, uy = dy / travel;
  const reach = Math.min(travel, PUSH_MAX);     /* 指が動いたぶんだけ動かす */

  const kept = [];
  let moved = 0;
  for (const r of settled) {
    const d = distToPath(r.x, r.y, path);
    if (d >= PUSH_RADIUS) { kept.push(r); continue; }
    /* 通り道の真上がいちばん強く、離れるほどなだらかに弱まる */
    const w = Math.pow(1 - d / PUSH_RADIUS, 1.3);
    const dist = reach * w;
    if (dist < 0.6) { kept.push(r); continue; }   /* ほとんど動かないものは置いたまま */
    /* すべる先。ほんの少しだけ横にも散らす(手でならしたときのばらつき) */
    const jitter = (Math.random() - 0.5) * 6 * w;
    sliding.push({
      rec: r,
      x0: r.x, y0: r.y,
      x1: r.x + ux * dist - uy * jitter,
      y1: r.y + uy * dist + ux * jitter,
      rot0: r.rot,
      rot1: r.rot + (Math.random() - 0.5) * 0.5 * w,
      t: 0, dur: PUSH_DUR * (0.8 + Math.random() * 0.4),
    });
    moved++;
  }
  if (moved === 0) return 0;

  /* 拾った箔は沈殿レイヤーから外す。触った所だけ作り直し、
     そこに残る記録を置き直す(下地はそのまま残す) */
  settled.length = 0;
  for (const r of kept) settled.push(r);
  const 道 = 通り道の形(path, PUSH_RADIUS + 12);
  通り道を描き直す(道, 通り道の囲い(path, PUSH_RADIUS + 14),
    kept.filter((r) => distToPath(r.x, r.y, path) < PUSH_RADIUS + 26), true);
  sparkles.length = 0;
  return moved;
}

/* ============================================================
   消す:指のまわりの箔を、散らしながら薄れさせて取り除く
   ------------------------------------------------------------
   見えている絵(沈殿レイヤー)だけ消しても足りない。ずらすときに
   「下地 + 記録」から描き直す作りなので、記録を落とさないと
   次にずらした瞬間に戻ってくる。5000枚を超えて記録から溢れた古い箔は
   下地に焼き付いていて記録が無いので、そちらは画素を直接消す。
   ・記録から捨てる ・下地の画素を消す ・描き直す の3つで1組
   ============================================================ */
const ERASE_RADIUS = 52;       /* 指の通り道から、この距離までが消える(px) */
const 消えゆく = [];            /* 散りながら薄れていく箔 */
const FADE_DUR = 0.45;

function erasePath(path) {
  const kept = [];
  const 近く = [];
  let 消した = 0;
  for (const r of settled) {
    const d = distToPath(r.x, r.y, path);
    if (d >= ERASE_RADIUS) {
      kept.push(r);
      /* すぐ外の箔は、絵が切り抜きにかかるので塗り直しの対象に入れる
         (入れないと、消した縁に沿って箔が齧られたように欠ける) */
      if (d < ERASE_RADIUS + 20) 近く.push(r);
      continue;
    }
    /* 縁はまばらに消す。まるく切り抜いたような跡にしない。
       消さずに残した箔は、このあと塗り直すので縁がぎざぎざに残る */
    const w = 1 - d / ERASE_RADIUS;
    if (Math.random() > 0.3 + w * 0.7) { kept.push(r); 近く.push(r); continue; }
    const a = Math.random() * Math.PI * 2;
    const 飛ぶ = 6 + Math.random() * 24 * w;
    消えゆく.push({
      rec: r, x0: r.x, y0: r.y,
      x1: r.x + Math.cos(a) * 飛ぶ, y1: r.y + Math.sin(a) * 飛ぶ - 5,
      rot0: r.rot, rot1: r.rot + (Math.random() - 0.5) * 1.4,
      t: 0, dur: FADE_DUR * (0.7 + Math.random() * 0.6),
    });
    消した++;
  }
  settled.length = 0;
  for (const r of kept) settled.push(r);

  const 道 = 通り道の形(path, ERASE_RADIUS);
  /* 記録から溢れて下地に焼き付いたぶんは、画素を直接消す。
     消さないと、次に何かをずらしたときに戻ってくる */
  baseCtx.save();
  baseCtx.clip(道);
  baseCtx.clearRect(0, 0, W, H);
  baseCtx.restore();
  /* 見えている絵も同じ所を抜いて、残した箔だけ置き直す(下地は戻さない) */
  通り道を描き直す(道, 通り道の囲い(path, ERASE_RADIUS + 2), 近く, false);
  sparkles.length = 0;          /* 消えた箔を光らせ続けない */
  return 消した;
}

function update消えゆく(dt) {
  for (let i = 消えゆく.length - 1; i >= 0; i--) {
    消えゆく[i].t += dt;
    if (消えゆく[i].t >= 消えゆく[i].dur) 消えゆく.splice(i, 1);
  }
}

function draw消えゆく() {
  for (const s of 消えゆく) {
    const p = Math.min(s.t / s.dur, 1);
    const e = 1 - Math.pow(1 - p, 2);
    const r = s.rec;
    ctx.save();
    ctx.translate(s.x0 + (s.x1 - s.x0) * e, s.y0 + (s.y1 - s.y0) * e);
    ctx.rotate(s.rot0 + (s.rot1 - s.rot0) * e);
    ctx.globalAlpha = (r.flipped ? 0.85 : r.bright) * (1 - p);
    ctx.fillStyle = (!r.flipped && r.gi >= 0) ? 焼箔の勾配(ctx, r.gi, r.size) : r.color;
    drawPoly(ctx, r.verts, 1);
    ctx.restore();
  }
}

/* すべっている箔を進め、着いたものは置き直す */
function updateSliding(dt) {
  for (let i = sliding.length - 1; i >= 0; i--) {
    const s = sliding[i];
    s.t += dt;
    if (s.t < s.dur) continue;
    /* 着いた:その場所へ置き直して、また記録に戻す */
    const r = s.rec;
    r.x = s.x1; r.y = s.y1; r.rot = s.rot1;
    /* 画面の中に収める */
    r.x = Math.max(2, Math.min(W - 2, r.x));
    r.y = Math.max(2, Math.min(H - 2, r.y));
    paintSettled(sedCtx, r);
    settled.push(r);
    sliding.splice(i, 1);
  }
  if (settled.length > MAX_SETTLED_RECORDS) {
    paintSettled(baseCtx, settled.shift());
  }
}

function drawSliding() {
  for (const s of sliding) {
    const p = Math.min(s.t / s.dur, 1);
    const e = 1 - Math.pow(1 - p, 3);           /* すっと出て、ふわりと止まる */
    const r = s.rec;
    ctx.save();
    ctx.translate(s.x0 + (s.x1 - s.x0) * e, s.y0 + (s.y1 - s.y0) * e);
    ctx.rotate(s.rot0 + (s.rot1 - s.rot0) * e);
    ctx.globalAlpha = r.flipped ? 0.85 : r.bright;
    ctx.fillStyle = (!r.flipped && r.gi >= 0) ? 焼箔の勾配(ctx, r.gi, r.size) : r.color;
    drawPoly(ctx, r.verts, 1);
    ctx.restore();
  }
}

/* ============================================================
   お題モード(蒔絵のお題)
   ------------------------------------------------------------
   ・型(駒・三日月・扇・富士)が薄く浮かび、「ひと匙」=限られた
     量の箔だけでその形に蒔く
   ・採点は2軸:
     埋まり … 型の内側をどれだけ広く覆えたか(升目の踏破率)
     こぼれ … 撒いた箔のうち型の外に落ちた割合(面積の重み付き)
   ・評価は 見習い → 職人 → 名人
   ============================================================ */

/* 型は core.js が持つ。ここでは点列を Path2D に起こすだけ。
   面積・ひと匙の量・こぼれの許し幅・難易度は、すべて型の形から
   計算で決まる(core.js)。手で数字を振らない */
const SHAPES = Core.buildShapes();

/* 点列から Path2D を作る */
function pathOf(points, m) {
  const p = new Path2D();
  p.moveTo(points[0][0], points[0][1]);
  for (let i = 1; i < points.length; i++) p.lineTo(points[i][0], points[i][1]);
  p.closePath();
  const out = new Path2D();
  out.addPath(p, m);
  return out;
}

/* 点の内外判定専用の小さなコンテキスト(変換の影響を受けないように分離) */
const hitCtx = document.createElement("canvas").getContext("2d");

const odai = {
  active: false,
  shapeIdx: 0,
  tPath: null,          /* 画面座標に変換済みのPath2D */
  budgetMax: 0,         /* ひと匙。型の広さから決まる(core.js) */
  budget: 0,
  inW: 0, outW: 0,      /* 内/外に落ちた箔の重み(面積)合計 */
  zoneSet: new Set(),   /* 型の内側にある升目(埋まり判定用) */
  zoneHit: new Set(),   /* 箔が届いた升目 */
  grid: null,           /* 升目の原点と間隔 { ox, oy, step } */
  bounds: null,         /* 型が画面のどこに来ているか(目安の帯に使う) */
  outline: null,        /* 輪郭を金砂で描くための点列 */
  result: null,         /* 採点結果(表示中はここに入る) */
  settleTimer: 0,       /* 匙が尽きてから採点までの待ち */
};

const hud = document.getElementById("odai-hud");
const hudName = document.getElementById("odai-name");
const hudLevel = document.getElementById("odai-level");
const hudLabel = document.getElementById("odai-gauge-label");
const hudFill = document.getElementById("odai-gauge-fill");
const resultEl = document.getElementById("result");

/* ============================================================
   記録:型ごとの最高、名人の数、連続。端末に残す
   ------------------------------------------------------------
   畳み込みと段位の計算は core.js 側(DOMを触らないのでテストできる)。
   ここは読み書きだけを受け持つ
   ============================================================ */
const STORE_KEY = "kinpaku-records-v1";
let records = Core.emptyRecords();

function loadRecords() {
  try {
    records = Core.reviveRecords(JSON.parse(localStorage.getItem(STORE_KEY)));
  } catch (_) {
    records = Core.emptyRecords();   /* 読めなくても遊べるようにする */
  }
}
function saveRecords() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(records)); } catch (_) { /* 容量超過などは黙って諦める */ }
}
loadRecords();

/* 型を画面中央に配置し、升目(埋まり判定のマス)を敷き直す */
function buildShapeGeometry() {
  const s = Math.min(W, H) * 0.32;          /* 型の大きさ */
  const cx = W / 2, cy = H * 0.42;          /* 少し上寄りに置く(下は操作帯) */
  const m = new DOMMatrix().translate(cx, cy).scale(s);
  odai.tPath = pathOf(SHAPES[odai.shapeIdx].points, m);

  /* 目安の帯を引くために、型が画面のどこに来たか覚えておく */
  const pts = SHAPES[odai.shapeIdx].points;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const [ux, uy] of pts) {
    x0 = Math.min(x0, cx + ux * s); x1 = Math.max(x1, cx + ux * s);
    y0 = Math.min(y0, cy + uy * s); y1 = Math.max(y1, cy + uy * s);
  }
  odai.bounds = { left: x0, right: x1, top: y0, bottom: y1 };

  /* 輪郭を金砂で描くために、画面座標の点列と、周に沿った距離を持つ */
  const 画面点 = pts.map(([ux, uy]) => [cx + ux * s, cy + uy * s]);
  const 累積 = [0];
  for (let i = 1; i <= 画面点.length; i++) {
    const a = 画面点[i - 1], b = 画面点[i % 画面点.length];
    累積.push(累積[i - 1] + Math.hypot(b[0] - a[0], b[1] - a[1]));
  }
  odai.outline = { pts: 画面点, 累積, 周: 累積[累積.length - 1] };

  /* 型を覆う範囲に升目を敷き、中心が型の内側にある升だけ登録 */
  const step = s * 0.27;
  const ox = cx - s * 1.15, oy = cy - s * 1.15;
  odai.grid = { ox, oy, step };
  odai.zoneSet.clear();
  const n = Math.ceil((s * 2.3) / step);
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      const px = ox + (i + 0.5) * step;
      const py = oy + (j + 0.5) * step;
      if (hitCtx.isPointInPath(odai.tPath, px, py)) {
        odai.zoneSet.add(i + "," + j);
      }
    }
  }
}

/* ラウンド開始/やり直し(型は変えずに匙と記録をリセット) */
function resetRound() {
  const shape = SHAPES[odai.shapeIdx];
  odai.budgetMax = shape.budget;        /* ひと匙は型の広さぶん */
  odai.budget = odai.budgetMax;
  odai.inW = 0; odai.outW = 0;
  odai.zoneHit.clear();
  odai.result = null;
  odai.settleTimer = 0;
  resultEl.classList.remove("show");
  hudName.textContent = "『" + shape.name + "』に蒔く";
  hudLevel.textContent = "◆".repeat(shape.difficulty) + "◇".repeat(5 - shape.difficulty);
  hudLabel.textContent = "ひと匙 " + odai.budgetMax + "枚";
  hudFill.style.width = "100%";
}

/* お題を開始。
   pick に数字を渡すとその型、true なら別の型を引く、false なら今の型のまま */
function startOdai(pick) {
  odai.active = true;
  if (typeof pick === "number") {
    odai.shapeIdx = Math.max(0, Math.min(SHAPES.length - 1, pick | 0));
  } else if (pick) {
    /* 直前と同じ型は避ける */
    let idx;
    do { idx = (Math.random() * SHAPES.length) | 0; }
    while (idx === odai.shapeIdx && SHAPES.length > 1);
    odai.shapeIdx = idx;
  }
  buildShapeGeometry();
  washAway();
  resetRound();
  hideHint();                 /* 案内文が型に重なるので消す */
  hud.classList.add("show");
  お題ボタンの名前("自由へ");
  指をお題向けにする();
}

/* 名前だけ書き換える。ボタンの中身ごと書き換えると、線画の絵まで消える */
function お題ボタンの名前(名) {
  document.querySelector("#btn-odai .cap").textContent = 名;
}

/* お題モードを抜ける(作品はそのまま残す) */
function endOdai() {
  odai.active = false;
  odai.result = null;
  hud.classList.remove("show");
  resultEl.classList.remove("show");
  お題ボタンの名前("お題");
  指をお題向けにする();
}

document.getElementById("btn-odai").addEventListener("click", () => {
  odai.active ? endOdai() : startOdai(true);
});
document.getElementById("btn-retry").addEventListener("click", () => {
  startOdai(true);   /* 別の型へ */
});
document.getElementById("btn-again").addEventListener("click", () => {
  startOdai(false);  /* 同じ型でやり直す */
});
document.getElementById("btn-free").addEventListener("click", endOdai);

/* ============================================================
   記録の帳
   ============================================================ */
const bookEl = document.getElementById("book");

function showBook() {
  const g = Core.grade(records, SHAPES.length);
  document.getElementById("book-grade").textContent = g.name;
  document.getElementById("book-summary").textContent =
    "名人の型 " + g.done + "/" + g.of + " ・ 蒔いた回数 " + records.rounds +
    " ・ 連続の最高 " + records.bestStreak;

  const rows = SHAPES.map((sh) => {
    const b = records.best[sh.name];
    const rank = b ? b.rank : "まだ";
    const detail = b ? Math.round(b.fill * 100) + "% / " + Math.round(b.spill * 100) + "%" : "—";
    /* 行をそのまま「この型で始める」ボタンにする。
       段位は「名人を取れた型の数」で決まるのに型を引き直すしかないと、
       残り1型を引くまで平均7回やり直すことになる */
    return "<tr data-shape=\"" + sh.index + "\">" +
           "<td class=\"name\">『" + sh.name + "』</td>" +
           "<td>" + "◆".repeat(sh.difficulty) + "</td>" +
           "<td class=\"rank-" + rank + "\">" + rank + "</td>" +
           "<td>" + detail + "</td></tr>";
  }).join("");
  const table = document.getElementById("book-table");
  table.innerHTML = rows;
  hideHint();        /* 帳の裏に案内文が透けるので消す */
  消す確認 = false;
  document.getElementById("btn-book-clear").textContent = "記録を消す";
  bookEl.classList.add("show");
}


/* 帳の行を押したら、その型でお題を始める */
document.getElementById("book-table").addEventListener("click", (e) => {
  const tr = e.target.closest("tr[data-shape]");
  if (!tr) return;
  bookEl.classList.remove("show");
  if (odai.active) endOdai();
  startOdai(Number(tr.dataset.shape));
});

/* 記録を消す。取り返しがつかないので、二度押しで確かめる */
let 消す確認 = false;
document.getElementById("btn-book-clear").addEventListener("click", (e) => {
  if (!消す確認) {
    消す確認 = true;
    e.target.textContent = "もう一度押すと消えます";
    return;
  }
  records = Core.emptyRecords();
  saveRecords();
  消す確認 = false;
  showBook();
  toast("記録を消しました");
});

document.getElementById("btn-book").addEventListener("click", showBook);
document.getElementById("btn-book-close").addEventListener("click", () => {
  bookEl.classList.remove("show");
});

/* ============================================================
   知らせの帯(払ったときなどに短く出す)
   ============================================================ */
const toastEl = document.getElementById("toast");
let toastTimer = 0;

function toast(text) {
  toastEl.textContent = text;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
}

/* 払う:積もった箔を全部流す。
   お題の最中は採点が絡むので、同じ型でのやり直しにする */
document.getElementById("btn-clear").addEventListener("click", () => {
  if (settled.length === 0 && flakes.length === 0 && sliding.length === 0 && !odai.active) {
    toast("まだ何も蒔かれていません");
    return;
  }
  sliding.length = 0;
  消えゆく.length = 0;
  baseCtx.clearRect(0, 0, W, H);   /* 記録から溢れて下地へ焼いたぶんも消す */
  washAway();
  if (odai.active) resetRound();   /* ひと匙も戻す */
});

/* 画面回転などでサイズが変わったら、型と升目を敷き直す */
window.addEventListener("resize", () => {
  if (odai.active) buildShapeGeometry();
});

/* 貼り付いた箔の内外を記録(stampFlakeから呼ばれる) */
function odaiRecord(f) {
  if (!odai.active || odai.result) return;
  const w = f.size * f.size;   /* 面積の重み */
  if (hitCtx.isPointInPath(odai.tPath, f.x, f.y)) {
    odai.inW += w;
    const g = odai.grid;
    const key = Math.floor((f.x - g.ox) / g.step) + "," + Math.floor((f.y - g.oy) / g.step);
    if (odai.zoneSet.has(key)) odai.zoneHit.add(key);
  } else {
    odai.outW += w;
  }
}

/* 採点:埋まり(升目の踏破率)とこぼれ(外に落ちた重みの割合) */
function judgeOdai() {
  const shape = SHAPES[odai.shapeIdx];
  const fill  = odai.zoneSet.size > 0 ? odai.zoneHit.size / odai.zoneSet.size : 0;
  const total = odai.inW + odai.outW;
  const spill = total > 0 ? odai.outW / total : 1;

  /* 採点の線引きは型ごとに違う(細い型はこぼれを多めに許す)。core.js が決める */
  const { rank, word } = Core.judge(fill, spill, shape);
  const result = { rank, fill, spill };
  odai.result = result;

  /* 記録を更新する前に、これが自己最高を塗り替えたかを見る */
  const prev = records.best[shape.name];
  const 初めて = !prev;
  const 塗り替え = prev && Core.rankValue(rank) > Core.rankValue(prev.rank);
  records = Core.applyResult(records, shape.name, result);
  saveRecords();

  document.getElementById("result-rank").textContent = rank;
  document.getElementById("result-detail").textContent =
    "埋まり " + Math.round(fill * 100) + "% ・ こぼれ " + Math.round(spill * 100) + "%";
  /* この型でこぼれをどこまで許すかは形で決まる。目標が見えるように出す */
  document.getElementById("result-limit").textContent =
    "この型は こぼれ " + Math.round(shape.spillMax * 100) + "% まで";

  /* 自己最高・連続・段位のうち、いちばん嬉しいものを一行で出す */
  const g = Core.grade(records, SHAPES.length);
  let note = "";
  if (g.name === "皆伝" && 塗り替え) note = "皆伝。すべての型で名人です";
  else if (塗り替え || (初めて && Core.rankValue(rank) > 0)) note = "『" + shape.name + "』の自己最高";
  else if (records.streak >= 2) note = records.streak + " 回続けて職人以上";
  else if (g.done > 0) note = "名人の型 " + g.done + " / " + g.of + "  (" + g.name + ")";
  document.getElementById("result-note").textContent = note;

  document.getElementById("result-word").textContent = word;
  resultEl.classList.add("show");
}

/* 周に沿った距離から、輪郭上の座標を引く */
function 輪郭の点(d) {
  const o = odai.outline;
  const t = ((d % o.周) + o.周) % o.周;
  let lo = 0, hi = o.累積.length - 1;
  while (lo < hi - 1) {
    const mid = (lo + hi) >> 1;
    if (o.累積[mid] <= t) lo = mid; else hi = mid;
  }
  const a = o.pts[lo], b = o.pts[(lo + 1) % o.pts.length];
  const 区間 = o.累積[lo + 1] - o.累積[lo] || 1;
  const k = (t - o.累積[lo]) / 区間;
  return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
}

/* 型の輪郭を金砂で描く(毎フレーム、積もった箔の上に)
   ------------------------------------------------------------
   破線で引くと図面の線に見える。細かい粒を周に沿って並べ、
   少しだけ外へ散らすと、金砂を置いた線になる */
function drawShapeOutline() {
  if (!odai.active || !odai.outline) return;
  const o = odai.outline;
  const 巡り = performance.now() / 26;        /* 粒がゆっくり周をめぐる */
  const 間隔 = 1.8;
  const n = Math.min(1100, Math.floor(o.周 / 間隔));

  /* 粒を1つずつ塗ると、1フレームに千回近く塗ることになる。
     明るさを数段階に丸めて、段ごとに1本の道としてまとめて塗る */
  const 段数 = 6;
  const 道 = [];
  for (let k = 0; k < 段数; k++) 道.push(new Path2D());
  const 強い = new Path2D();
  let 強いのがある = false;

  for (let i = 0; i < n; i++) {
    const d = i * 間隔 + 巡り;
    const [px, py] = 輪郭の点(d);
    /* 粒ごとの明るさを、周に沿ってうねらせる。
       周期がひとつだと等間隔に光って真珠の連なりに見えるので、
       噛み合わない2つの波を掛け合わせて、むらのある散らばりにする */
    const w = 0.34 + 0.66 * Math.abs(Math.sin(d * 0.061) * Math.sin(d * 0.0173 + 1.3));
    const ずれ = Math.sin(d * 0.37 + i * 2.1) * 1.7;   /* 線から少しだけ外す */
    const r = 0.46 + w * 0.86;
    const x = px + ずれ, y = py + ずれ * 0.6;
    const k = Math.min(段数 - 1, (w * 段数) | 0);
    道[k].moveTo(x + r, y);
    道[k].arc(x, y, r, 0, Math.PI * 2);
    /* ときどき、粒がひとつ強く光る */
    if (w > 0.985) {
      強い.moveTo(x + r * 2.6, y);
      強い.arc(x, y, r * 2.6, 0, Math.PI * 2);
      強いのがある = true;
    }
  }

  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.fillStyle = "#e8c15a";
  for (let k = 0; k < 段数; k++) {
    ctx.globalAlpha = 0.17 + ((k + 0.5) / 段数) * 0.55;
    ctx.fill(道[k]);
  }
  if (強いのがある) {
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = "#fff6d5";
    ctx.fill(強い);
  }
  ctx.restore();
}

/* ============================================================
   色の切り替え
   ============================================================ */
const swatches = {
  gold: "sw-gold", silver: "sw-silver", copper: "sw-copper",
  ao: "sw-ao", yaki: "sw-yaki",
};
/* 指がやることの並び。ここから1つだけが選ばれている */
const 指の並び = [...Object.values(swatches), "btn-slide", "btn-erase"];

function 指を選ぶ(id) {
  for (const k of 指の並び) {
    document.getElementById(k).classList.toggle("active", k === id);
  }
}

/* 箔の名前。額と品書きで同じものを使う */
const 箔の名 = { gold: "金箔", silver: "銀箔", copper: "赤金", ao: "青金", yaki: "焼箔" };

const 額 = document.getElementById("palette");
const 額の箔 = document.getElementById("palette-foil");
const 額の名 = document.getElementById("palette-name");
const 額のボタン = document.getElementById("palette-open");

function 品書きを開く(開く) {
  額.classList.toggle("open", 開く);
  額のボタン.setAttribute("aria-expanded", 開く ? "true" : "false");
}

額のボタン.addEventListener("click", (e) => {
  e.stopPropagation();
  品書きを開く(!額.classList.contains("open"));
});

for (const [key, id] of Object.entries(swatches)) {
  document.getElementById(id).addEventListener("click", (e) => {
    e.stopPropagation();
    currentPalette = key;
    手 = "蒔く";
    指を選ぶ(id);
    /* 額の箔と名前を、選んだものに差し替える */
    額の箔.dataset.foil = key;
    額の名.textContent = 箔の名[key];
    品書きを開く(false);      /* 選んだら閉じる */
  });
}

/* 品書きを開いたまま別の所を触ったら閉じる(画面を触ったときは蒔きたい)。
   棚の中を触ったときは閉じない。閉じてしまうと、品書きの箔を押す前に
   その箔が消えて、押せなくなる */
window.addEventListener("pointerdown", (e) => {
  if (!額.classList.contains("open")) return;
  if (e.target instanceof Element && e.target.closest("#palette")) return;
  品書きを開く(false);
}, true);

for (const [id, やること] of [["btn-slide", "ずらす"], ["btn-erase", "消す"]]) {
  document.getElementById(id).addEventListener("click", () => {
    if (odai.active) { toast("お題の間は使えません"); return; }
    手 = やること;
    指を選ぶ(id);
  });
}

/* お題では採点が絡む。ずらす・消すを切って、蒔く手に戻す */
function 指をお題向けにする() {
  for (const id of ["btn-slide", "btn-erase"]) {
    document.getElementById(id).classList.toggle("disabled", odai.active);
  }
  if (odai.active && 手 !== "蒔く") {
    手 = "蒔く";
    指を選ぶ(swatches[currentPalette]);
  }
}

/* ============================================================
   背景:真っ黒で固定。箔の金をいちばん際立たせるため、
   中央を温める照りも斜めの艶も置かない
   ============================================================ */
const BG = "#000000";

function drawBackground(c) {
  c.fillStyle = BG;
  c.fillRect(0, 0, W, H);
}

/* ============================================================
   タイトル画面
   ------------------------------------------------------------
   金箔がひらひら落ちてくるところだけを見せる。触れると遊ぶ画面へ。

   ・動きは参考コードの作りをそのまま使う:落ちる速さ・横揺れ(sinと位相)・
     回転・ゆっくり吹く風(乱数歩行を0.995で減らす)を、箔ごとに個体差つきで持たせる
   ・奥行きは三層。奥の箔はぼかして小さく遅く、手前ははっきり大きく速く
   ・ぼけは毎フレーム ctx.filter=blur() を掛けると一気にコマ落ちするので、
     あらかじめ描いた柔らかい丸を拡大して使う
   ・タイトルが出ている間はメインループの描画を止める(遊ぶ画面は隠れている)
   ============================================================ */
const titleEl    = document.getElementById("title-screen");
const titleCv    = document.getElementById("titlecv");
const titleCtx   = titleCv.getContext("2d");
let titleUp = true;

/* 奥のぼけ玉のもと:中心が明るく、外へ向かって溶ける丸 */
const bokehSprite = document.createElement("canvas");
bokehSprite.width = bokehSprite.height = 64;
{
  const bc = bokehSprite.getContext("2d");
  const g = bc.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0,    "rgba(255,238,186,0.95)");
  g.addColorStop(0.35, "rgba(226,193,104,0.55)");
  g.addColorStop(0.72, "rgba(184,134,47,0.18)");
  g.addColorStop(1,    "rgba(184,134,47,0)");
  bc.fillStyle = g;
  bc.fillRect(0, 0, 64, 64);
}

const TITLE_GOLD = ["#f0d878", "#e8c15a", "#d4a944", "#c69436", "#f7e9b0"];

/* 三層。depth は 0(遠く)〜1(手前) */
const TITLE_LAYERS = [
  /* 絵そのものに、ぼけた箔がたくさん写っている。重ねすぎると濁るので控えめに */
  { n: 8,  depth: 0.26, bokeh: true  },
  { n: 18, depth: 0.62, bokeh: false },
  { n: 14, depth: 1.00, bokeh: false },
];

const titleFlakes = [];
let titleWind = 0;

function makeTitleFlake(layer, y) {
  const d = layer.depth;
  const size = (1.6 + Math.random() * 4.4) * (0.45 + d * 0.9);
  const verts = [];
  for (let i = 0; i < 4; i++) {
    const a = (Math.PI / 2) * i + (Math.random() - 0.5) * 0.7;
    const r = size * (0.6 + Math.random() * 0.5);
    verts.push([Math.cos(a) * r, Math.sin(a) * r]);
  }
  return {
    depth: d, bokeh: layer.bokeh, size, verts,
    x: Math.random() * (W + 60) - 30,
    y,
    speed: (0.22 + Math.random() * 0.45) * (0.35 + d * 1.1),  /* 1フレームあたりpx */
    swayAmp: (0.25 + Math.random() * 0.75) * (0.4 + d * 0.8), /* 横揺れの幅 */
    swaySpeed: 0.016 + Math.random() * 0.03,
    phase: Math.random() * Math.PI * 2,
    rot: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 0.05 * (0.4 + d),
    facePhase: Math.random() * Math.PI * 2,
    faceRate: 0.03 + Math.random() * 0.06,
    color: TITLE_GOLD[(Math.random() * TITLE_GOLD.length) | 0],
  };
}

/* 開いた瞬間から降っているように、最初は画面じゅうに散らしておく */
function seedTitleFlakes() {
  titleFlakes.length = 0;
  for (const layer of TITLE_LAYERS) {
    for (let i = 0; i < layer.n; i++) {
      titleFlakes.push(makeTitleFlake(layer, Math.random() * (H + 80) - 40));
    }
  }
}

function resizeTitle() {
  titleCv.width  = W * DPR; titleCv.height = H * DPR;
  titleCv.style.width = W + "px"; titleCv.style.height = H + "px";
  titleCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resizeTitle();
seedTitleFlakes();
window.addEventListener("resize", () => {
  resizeTitle();
  if (titleUp) seedTitleFlakes();
});

function drawTitle(dt) {
  const k = Math.min(dt, 0.05) * 60;      /* 60fps を1とした歩幅 */

  /* ゆっくり向きの変わる風。乱数歩行に減衰をかけて、たまに横へ流す */
  titleWind += (Math.random() - 0.5) * 0.02 * k;
  titleWind *= Math.pow(0.995, k);

  for (const f of titleFlakes) {
    f.phase     += f.swaySpeed * k;
    f.rot       += f.rotSpeed * k;
    f.facePhase += f.faceRate * k;
    f.y += f.speed * k;
    f.x += (Math.sin(f.phase) * f.swayAmp + titleWind * f.depth * 2.2) * k;
    /* 下まで落ちたら、また上から。横に流れ切ったときも戻す */
    if (f.y > H + 40 || f.x < -40 || f.x > W + 40) {
      f.y = -20 - Math.random() * 60;
      f.x = Math.random() * (W + 60) - 30;
    }
  }

  /* 背景(黒と照り)は CSS 側。ここは消して箔だけ描く */
  titleCtx.clearRect(0, 0, W, H);

  for (const f of titleFlakes) {
    if (f.bokeh) {
      /* 奥:ピントの外れた光の玉。輪郭を描かず、拡大した丸で済ませる */
      const r = f.size * 3.4;
      titleCtx.globalAlpha = 0.13 + Math.sin(f.facePhase) * 0.04;
      titleCtx.drawImage(bokehSprite, f.x - r, f.y - r, r * 2, r * 2);
      continue;
    }
    const face   = Math.sin(f.facePhase);
    const yScale = Math.abs(face) * 0.85 + 0.15;   /* 横を向くと細く見える */
    titleCtx.save();
    titleCtx.translate(f.x, f.y);
    titleCtx.rotate(f.rot);
    titleCtx.fillStyle = f.color;
    titleCtx.globalAlpha = (0.4 + Math.abs(face) * 0.6) * (0.45 + f.depth * 0.55);
    drawPoly(titleCtx, f.verts, yScale);
    titleCtx.restore();
  }
  titleCtx.globalAlpha = 1;
}

/* 触れたら遊ぶ画面へ。薄れ切ってから display:none にして、
   消えたあとの一枚が指の邪魔をしないようにする */
/* タイトルの絵を、根っこ(html)の背景にも敷く。
   背景だけは切り取られず、ウェブ画面いっぱいに塗られるので、
   渡された高さ(873)より下の帯まで絵が届く。
   遊ぶ画面では黒に戻す(絵が下の帯に残ってしまうため) */
function 根に絵を敷く(敷く) {
  const 根 = document.documentElement.style;
  根.backgroundImage = 敷く ? "url('./title.jpg')" : "none";
  根.backgroundSize = "cover";
  根.backgroundPosition = "center";
  根.backgroundRepeat = "no-repeat";
}
根に絵を敷く(true);

function dismissTitle() {
  if (!titleUp) return;
  titleUp = false;
  titleEl.classList.add("gone");
  setTimeout(() => {
    titleEl.classList.add("off");
    根に絵を敷く(false);
  }, 520);
}
titleEl.addEventListener("pointerdown", (e) => { e.preventDefault(); dismissTitle(); });

/* ============================================================
   メインループ
   ============================================================ */
let lastT = performance.now();

function frame(now) {
  const dt = Math.min((now - lastT) / 1000, 0.05);  /* タブ復帰時の暴走防止 */
  lastT = now;

  /* タイトルが出ている間は、その裏の遊ぶ画面を描かない。
     見えていない絵に毎フレーム全画面ぶんの合成を掛けると、
     遅い端末でタイトルの箔がかくつく */
  if (titleUp) {
    drawTitle(dt);
    requestAnimationFrame(frame);
    return;
  }

  /* --- 長押し中は撒き続ける(押している時間で少しずつ勢いが増す) --- */
  if (pointer.down && 手 === "蒔く") {
    pointer.holdTime += dt;
    const rate = Math.min(3 + pointer.holdTime * 3, 9);  /* 毎フレームの発生数 */
    emitBurst(pointer.x, pointer.y, rate | 0, pointer.holdTime > 1.2);
  } else if (pointer.down && 手 === "消す") {
    /* 押したまま止めていても、その場が消え続ける(消しゴムらしく) */
    手を進める(pointer.x, pointer.y);
  }

  /* --- 舞っている箔の更新 --- */
  for (let i = flakes.length - 1; i >= 0; i--) {
    const f = flakes[i];
    f.vy += GRAVITY * dt;
    f.vy = Math.min(f.vy, 1.6);              /* 終端速度(ひらひら感を保つ) */
    f.swayPhase += (1.5 + f.swayAmp) * dt * 2.2;
    f.x += f.vx + f.pvx + Math.sin(f.swayPhase) * f.swayAmp;
    f.y += f.vy + f.pvy;
    f.vx *= 0.985;                           /* 空気抵抗 */
    f.pvx *= POP_DECAY; f.pvy *= POP_DECAY;  /* 弾けた勢いはすぐ収まる */
    f.rot += f.vr;
    f.facePhase += f.faceRate;

    /* 画面外(左右・上)へ流れた箔は破棄 */
    if (f.x < -20 || f.x > W + 20 || f.y < -30) { flakes.splice(i, 1); continue; }

    /* 貼り付き判定:落下中(vy>0)に既定の高さへ達したら焼き込む */
    if (f.vy > 0 && f.y >= Math.min(f.settleY, H - 4)) {
      stampFlake(f);
      flakes.splice(i, 1);
    }
  }

  updateSparkles(dt);
  updateSliding(dt);
  update消えゆく(dt);

  /* --- 描画 --- */
  drawBackground(ctx);

  /* 洗い流しアニメーション:退避した層が下へ流れながら薄れる */
  if (washing) {
    washing.t += dt;
    const p = Math.min(washing.t / 1.4, 1);
    const ease = p * p * (3 - 2 * p);        /* smoothstep */
    ctx.save();
    ctx.globalAlpha = 1 - ease;
    ctx.drawImage(washing.snap, 0, ease * H * 0.6, W, H);
    ctx.restore();
    if (p >= 1) washing = null;
  }

  /* 積もった箔 */
  ctx.drawImage(sedCv, 0, 0, W, H);

  /* すべっている最中の箔と、消えていく箔 */
  drawSliding();
  draw消えゆく();

  /* お題の型の輪郭(積もった箔の上、舞う箔の下) */
  drawShapeOutline();

  /* お題の採点:匙が尽き、すべての箔が落ち切ったら少し間を置いて判定 */
  if (odai.active && !odai.result && odai.budget <= 0 &&
      flakes.length === 0 && !washing) {
    odai.settleTimer += dt;
    if (odai.settleTimer > 0.8) judgeOdai();
  }

  /* 舞っている箔:表裏の傾きで明るさと縦幅が変わる=きらめき */
  for (const f of flakes) {
    const face = Math.sin(f.facePhase);              /* -1..1 表裏の傾き */
    const yScale = Math.abs(face) * 0.85 + 0.15;     /* 端に向くと細く */
    const bright = Math.abs(face);
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.rot);
    ctx.fillStyle = f.gi >= 0 ? 焼箔の勾配(ctx, f.gi, f.size) : f.color;
    ctx.globalAlpha = 0.55 + bright * 0.45;
    drawPoly(ctx, f.verts, yScale);
    /* 面がこちらを向いた瞬間、glint色でひときわ光る */
    if (bright > 0.88) {
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = (bright - 0.88) / 0.12 * 0.7;
      ctx.fillStyle = f.glint;
      drawPoly(ctx, f.verts, yScale);
    }
    ctx.restore();
  }

  drawSparkles();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ============================================================
   テストからのぞくための入口
   ------------------------------------------------------------
   ロジックが画面と同じところに居るので、ブラウザテストから
   中身を確かめる手立てがこれしかない。動作には関わらない。
   ============================================================ */
window.__app = {
  flakes, settled, sliding, sparkles, odai, SHAPES,
  Core,
  slidePush, PUSH_RADIUS, SETTLE_MIN, SETTLE_SPAN,
  YAKI_PAIRS,
  bladePush, distToPath, BLADE_R,
  titleFlakes,
  isTitleUp() { return titleUp; },
  dismissTitle,
  get records() { return records; },
  setRecords(r) { records = Core.reviveRecords(r); saveRecords(); },
  /* 積もった箔だけを写し取る。きらめきや舞っている箔、型の輪郭が
     混ざらないので、テストで作品そのものを測るのに使う */
  sedimentSnapshot() {
    const out = document.createElement("canvas");
    out.width = sedCv.width; out.height = sedCv.height;
    out.getContext("2d").drawImage(sedCv, 0, 0);
    return out;
  },
  /* 型を指定して組み直す(採点の当たり判定に使うPath2Dが手に入る) */
  useShape(i) {
    odai.shapeIdx = i;
    buildShapeGeometry();
    return odai.tPath;
  },
  isInsideShape(x, y) { return hitCtx.isPointInPath(odai.tPath, x, y); },
};

/* ============================================================
   PWA:Service Worker登録(オフラインでも遊べるように)
   ============================================================ */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {
