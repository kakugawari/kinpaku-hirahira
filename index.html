<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover が無いと env(safe-area-inset-*) が常に 0 になり、
     下の操作帯がホームバーに、題字が時計に重なる -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>金箔ひらひら</title>
<!-- ===== PWA設定 ===== -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<!-- iOS: ホーム画面追加用 -->
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="金箔ひらひら">
<style>
  /* ===== 全体:漆器の質感を意識した黒基調 ===== */
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000000;
    touch-action: none;            /* スクロール等のブラウザ既定動作を無効化 */
    -webkit-user-select: none; user-select: none;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
  }
  canvas { display: block; }

  /* ===== 題字(左上に小さく) ===== */
  #title {
    /* ホーム画面から開くと画面いっぱいに広がるので、上の余白を足さないと
       時計やダイナミックアイランドの裏に入る (iPhone 16 Plus は上 59pt) */
    position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: 18px;
    color: rgba(201,162,75,0.85);
    font-size: 15px; letter-spacing: 0.35em;
    writing-mode: vertical-rl;      /* 縦書きで和の趣を */
    pointer-events: none;
    text-shadow: 0 0 12px rgba(201,162,75,0.25);
  }

  /* ===== 最初の案内文(触れると消える) ===== */
  #hint {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: rgba(220,190,120,0.55);
    font-size: 14px; letter-spacing: 0.25em;
    pointer-events: none;
    transition: opacity 1.2s ease;
    text-align: center;
    white-space: nowrap;
  }
  #hint.hidden { opacity: 0; }

  /* ===== 下部の操作帯:漆の艶をイメージした半透明バー ===== */
  #bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: center;
    gap: 12px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0));
  }
  .swatch {
    width: 30px; height: 30px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.15);
    cursor: pointer;
    flex: 0 0 auto;              /* 詰まっても押し所を潰さない */
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .swatch.active {
    transform: scale(1.18);
    box-shadow: 0 0 10px 2px rgba(255,240,190,0.35);
    border-color: rgba(255,240,190,0.7);
  }
  #sw-gold   { background: radial-gradient(circle at 35% 35%, #f4dc86, #c89a34 70%); }
  #sw-silver { background: radial-gradient(circle at 35% 35%, #f2f4f7, #a7adb6 70%); }
  #sw-copper { background: radial-gradient(circle at 35% 35%, #e59a55, #a8511f 70%); }

  .divider { width: 1px; height: 22px; background: rgba(255,255,255,0.12); }

  .btn {
    color: rgba(220,196,140,0.85);
    background: none; border: 1px solid rgba(220,196,140,0.3);
    border-radius: 4px;
    font-family: inherit; font-size: 12px; letter-spacing: 0.15em;
    padding: 7px 12px;
    white-space: nowrap;
    flex: 0 0 auto;              /* 詰まっても押し所を潰さない */
    cursor: pointer;
  }
  .btn:active { background: rgba(220,196,140,0.12); }


  /* ===== お題モード:上部の掲示(お題名と残りひと匙) ===== */
  #odai-hud {
    position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); left: 50%;
    transform: translateX(-50%);
    display: none;
    flex-direction: column; align-items: center; gap: 6px;
    pointer-events: none;
  }
  #odai-hud.show { display: flex; }
  #odai-name {
    color: rgba(230,205,140,0.9);
    font-size: 15px; letter-spacing: 0.25em;
    text-shadow: 0 0 10px rgba(201,162,75,0.3);
  }
  #odai-gauge {
    width: 140px; height: 5px;
    border: 1px solid rgba(230,205,140,0.35);
    border-radius: 3px;
    overflow: hidden;
  }
  #odai-gauge-fill {
    height: 100%; width: 100%;
    background: linear-gradient(to right, #c9a24b, #f0d878);
    transition: width 0.15s ease;
  }
  #odai-gauge-label {
    color: rgba(230,205,140,0.55);
    font-size: 11px; letter-spacing: 0.2em;
  }

  /* ===== お題モード:結果の掛け軸風パネル ===== */
  #result {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    /* left:50% だけだと、幅を決める余地が画面の右半分しか残らない
       (transform は描画位置をずらすだけで、幅の計算には効かない)。
       内容ぶんの幅を取り、画面からはみ出さないところで止める。
       padding を幅に含めるため box-sizing も要る */
    box-sizing: border-box;
    width: max-content;
    max-width: min(360px, calc(100vw - 32px));
    display: none;
    flex-direction: column; align-items: center; gap: 14px;
    padding: 28px 36px;
    background: rgba(14,10,6,0.92);
    border: 1px solid rgba(201,162,75,0.4);
    border-radius: 6px;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
  }
  #result.show { display: flex; }
  #result-rank {
    color: #f0d878;
    font-size: 34px; letter-spacing: 0.3em;
    text-shadow: 0 0 16px rgba(240,216,120,0.35);
  }
  #result-detail {
    color: rgba(230,210,170,0.75);
    font-size: 13px; letter-spacing: 0.12em;
  }
  #result-word {
    color: rgba(230,210,170,0.55);
    font-size: 12px; letter-spacing: 0.15em;
  }
  #result-buttons { display: flex; gap: 10px; margin-top: 4px; flex-wrap: wrap; justify-content: center; }
  #result-note {
    color: #e6cd8c;
    font-size: 12px; letter-spacing: 0.12em;
  }
  #result-limit {
    color: rgba(230,210,170,0.45);
    font-size: 11px; letter-spacing: 0.1em;
    margin-top: -8px;
  }

  /* お題の難易度 */
  #odai-level {
    color: rgba(230,205,140,0.7);
    font-size: 11px; letter-spacing: 0.3em;
  }

  /* ===== 記録の帳 ===== */
  #book {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    box-sizing: border-box;
    width: max-content;
    max-width: min(360px, calc(100vw - 32px));
    max-height: calc(100vh - 80px);
    overflow-y: auto;
    display: none;
    flex-direction: column; align-items: center; gap: 12px;
    padding: 24px 28px;
    background: rgba(8,8,8,0.95);
    border: 1px solid rgba(201,162,75,0.4);
    border-radius: 6px;
    box-shadow: 0 0 40px rgba(0,0,0,0.7);
  }
  #book.show { display: flex; }
  #book-grade {
    color: #f0d878;
    font-size: 26px; letter-spacing: 0.3em;
    text-shadow: 0 0 16px rgba(240,216,120,0.35);
  }
  #book-summary {
    color: rgba(230,210,170,0.7);
    font-size: 12px; letter-spacing: 0.1em; text-align: center;
  }
  #book-table {
    border-collapse: collapse;
    color: rgba(230,210,170,0.8);
    font-size: 12px; letter-spacing: 0.08em;
  }
  #book-table td { padding: 4px 8px; white-space: nowrap; }
  #book-table td.name { color: rgba(230,205,140,0.95); }
  #book-table td.rank-名人 { color: #f0d878; }
  #book-table td.rank-まだ { color: rgba(200,190,170,0.35); }

  /* 写したときの知らせ */
  #toast {
    position: fixed; left: 50%; bottom: 76px;
    transform: translateX(-50%);
    box-sizing: border-box;
    max-width: calc(100vw - 32px);
    padding: 8px 16px;
    background: rgba(8,8,8,0.9);
    border: 1px solid rgba(201,162,75,0.35);
    border-radius: 4px;
    color: rgba(230,210,170,0.9);
    font-size: 12px; letter-spacing: 0.12em;
    white-space: nowrap;
    opacity: 0; transition: opacity 0.3s ease;
    pointer-events: none;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<canvas id="cv"></canvas>
<div id="title">金箔ひらひら</div>
<div id="hint">触れて蒔き なでてずらす</div>

<div id="bar">
  <div class="swatch active" id="sw-gold"   title="金"></div>
  <div class="swatch"        id="sw-silver" title="銀"></div>
  <div class="swatch"        id="sw-copper" title="赤金"></div>
  <div class="divider"></div>
  <button class="btn" id="btn-odai">お題</button>
  <button class="btn" id="btn-save">写す</button>
  <button class="btn" id="btn-book">記録</button>
  <button class="btn" id="btn-clear">払う</button>
</div>

<!-- お題モード:上部掲示 -->
<div id="odai-hud">
  <div id="odai-name"></div>
  <div id="odai-level"></div>
  <div id="odai-gauge"><div id="odai-gauge-fill"></div></div>
  <div id="odai-gauge-label">ひと匙</div>
</div>

<!-- お題モード:結果 -->
<div id="result">
  <div id="result-rank"></div>
  <div id="result-detail"></div>
  <div id="result-limit"></div>
  <div id="result-note"></div>
  <div id="result-word"></div>
  <div id="result-buttons">
    <button class="btn" id="btn-retry">次の型へ</button>
    <button class="btn" id="btn-again">同じ型で</button>
    <button class="btn" id="btn-free">自由に戻る</button>
  </div>
</div>

<div id="toast"></div>

<!-- 記録の帳 -->
<div id="book">
  <div id="book-grade"></div>
  <div id="book-summary"></div>
  <table id="book-table"></table>
  <button class="btn" id="btn-book-close">閉じる</button>
</div>

<script src="./core.js"></script>
<script>
"use strict";

const Core = window.KinpakuCore;

/* ============================================================
   金箔散らし
   - タップ / なぞりで金箔が舞い散り、少し落ちた先で貼り付く
   - 落下中は箔が回転し、光を受けてきらめく
   - 貼り付いた箔は「沈殿レイヤー」(オフスクリーンCanvas)に
     焼き込むため、何万枚積もっても描画負荷は一定
   ============================================================ */

const cv  = document.getElementById("cv");
const ctx = cv.getContext("2d");

/* 沈殿レイヤー:貼り付いた箔を焼き込む先 */
const sedCv  = document.createElement("canvas");
const sedCtx = sedCv.getContext("2d");

/* 記録から溢れたぶんを焼き付けておく下地。
   指でずらすときは沈殿レイヤーを記録から描き直すので、記録を落とした箔が
   消えてしまわないよう、落とす前にここへ写しておく。
   resize() が触るので、沈殿レイヤーと同じところで用意する */
const baseCv  = document.createElement("canvas");
const baseCtx = baseCv.getContext("2d");

let W = 0, H = 0, DPR = 1;

/* ----- 端末解像度に合わせてCanvasを設定(リサイズ時は積もった箔を引き継ぐ) ----- */
function resize() {
  const oldW = sedCv.width, oldH = sedCv.height;
  let old = null;
  if (oldW > 0 && oldH > 0) {
    /* 既存の沈殿レイヤーを一時退避 */
    old = document.createElement("canvas");
    old.width = oldW; old.height = oldH;
    old.getContext("2d").drawImage(sedCv, 0, 0);
  }
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width  = W * DPR; cv.height  = H * DPR;
  cv.style.width = W + "px"; cv.style.height = H + "px";
  sedCv.width = W * DPR; sedCv.height = H * DPR;
  baseCv.width = W * DPR; baseCv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  sedCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
  baseCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (old) sedCtx.drawImage(old, 0, 0, oldW / DPR, oldH / DPR); /* 論理座標系で貼り直し */
}
window.addEventListener("resize", resize);
resize();

/* ============================================================
   色定義:金・銀・赤金の三種。base=箔の地色、glint=きらめきの色
   ============================================================ */
const PALETTES = {
  gold:   { base: ["#e8c15a", "#d4a944", "#c69436", "#f0d878", "#b8862f"], glint: "#fff6d5" },
  silver: { base: ["#d9dde3", "#b9bec7", "#eef1f5", "#a9aeb8", "#c8cdd5"], glint: "#ffffff" },
  copper: { base: ["#c9722f", "#b25a26", "#e08a3c", "#d97a35", "#9c4a1e"], glint: "#ffd9b0" },
};
let currentPalette = "gold";

/* ============================================================
   舞っている箔(落下中のパーティクル)
   ============================================================ */
const flakes = [];
const MAX_FLAKES = 600;   /* 同時に舞える箔の上限(端末負荷対策) */

/* 箔一枚を生成:不定形の四角形として頂点を持たせる
   大きさは蒔絵の配合に倣った3階層:
   ・砂子(すなご) …ごく細かい粉。全体の約8割
   ・中粒          …小さな箔片。約2割
   ・大判          …ひと摘みだけ混ざる大きな箔(長押しでも出る) */
function makeFlake(x, y, big) {
  let size, grade;
  const roll = Math.random();
  if (big || roll > 0.98) {          /* 大判:2% */
    grade = 2;
    size = 6 + Math.random() * 5;
  } else if (roll > 0.78) {          /* 中粒:20% */
    grade = 1;
    size = 3 + Math.random() * 2.2;
  } else {                           /* 砂子:78% */
    grade = 0;
    size = 1.2 + Math.random() * 1.2;
  }
  /* 金箔片らしい角ばった不定形の頂点(4点) */
  const verts = [];
  for (let i = 0; i < 4; i++) {
    const a = (Math.PI / 2) * i + (Math.random() - 0.5) * 0.7;
    const r = size * (0.6 + Math.random() * 0.5);
    verts.push([Math.cos(a) * r, Math.sin(a) * r]);
  }
  const colors = PALETTES[currentPalette].base;
  return {
    x, y,
    grade, size,
    vx: (Math.random() - 0.5) * 1.6,        /* 横方向の初速 */
    vy: -Math.random() * 1.2 - 0.2,          /* 少し舞い上がってから落ちる */
    rot: Math.random() * Math.PI * 2,        /* 面内回転 */
    vr: (Math.random() - 0.5) * (grade === 2 ? 0.06 : 0.12),  /* 大判はゆったり回る */
    facePhase: Math.random() * Math.PI * 2,  /* 表裏の傾き(きらめき用の位相) */
    faceRate: (grade === 0 ? 0.08 : 0.05) + Math.random() * 0.08,  /* 砂子は忙しなくひらめく */
    swayPhase: Math.random() * Math.PI * 2,  /* 左右の揺らぎの位相 */
    swayAmp: (grade === 0 ? 0.45 : 0.25) + Math.random() * 0.5,    /* 軽い粉ほどよく漂う */
    verts,
    color: colors[(Math.random() * colors.length) | 0],
    glint: PALETTES[currentPalette].glint,
    settleY: y + 60 + Math.random() * 220,   /* この高さまで落ちたら貼り付く */
  };
}

/* ============================================================
   貼り付いた箔の記録:きらめき演出の抽選用(描画自体は焼き込み済み)
   ============================================================ */
const settled = [];
const MAX_SETTLED_RECORDS = 5000;

/* 記録1枚を、指定のコンテキストへ描く(最初の焼き込みも描き直しも同じ道を通る) */
function paintSettled(c, r) {
  c.save();
  c.translate(r.x, r.y);
  c.rotate(r.rot);
  if (r.flipped) {
    /* 裏面:光を返さない暗い箔。艶消しの陰が金属らしさを生む */
    c.globalAlpha = 0.85;
    c.fillStyle = r.color;
    drawPoly(c, r.verts, 1);
  } else {
    /* 表面:明度の個体差を広めに取り、平坦さをなくす */
    c.globalAlpha = r.bright;
    c.fillStyle = r.color;
    drawPoly(c, r.verts, 1);
    /* ごく薄い縁のハイライトで箔の厚みを表現 */
    c.globalAlpha = r.bright * 0.35;
    c.strokeStyle = r.glint;
    c.lineWidth = 0.5;
    c.stroke();
  }
  c.restore();
}

/* 沈殿レイヤーを、下地 + いまの記録から描き直す */
function rebuildSediment() {
  sedCtx.save();
  sedCtx.setTransform(1, 0, 0, 1, 0, 0);
  sedCtx.clearRect(0, 0, sedCv.width, sedCv.height);
  sedCtx.drawImage(baseCv, 0, 0);
  sedCtx.restore();
  for (const r of settled) paintSettled(sedCtx, r);
}

/* 箔を沈殿レイヤーに焼き込む(=漆に貼り付く) */
function stampFlake(f) {
  const flipped = Math.random() < 0.08;   /* 約8%は裏返って貼り付く */
  const rec = {
    x: f.x, y: f.y, size: f.size + 2, glint: f.glint,
    /* ずらすときに姿を復元するための情報 */
    verts: f.verts, rot: f.rot,
    flipped, bright: 0.55 + Math.random() * 0.45,
    color: flipped ? shadeColor(f.color, 0.45) : f.color,
  };
  paintSettled(sedCtx, rec);
  settled.push(rec);
  if (settled.length > MAX_SETTLED_RECORDS) {
    /* 記録から落とすぶんは、消えないよう下地へ焼き付けてから捨てる */
    paintSettled(baseCtx, settled.shift());
  }

  /* お題モード:この箔が型の内か外かを記録 */
  odaiRecord(f);

  /* 着地の余韻:ぺたっと定着した瞬間、小さくきらっと光る
     (表向きの箔だけ。大きい箔ほど少し強く光る) */
  if (!flipped && !reduceMotion) {
    sparkles.push({
      x: f.x, y: f.y, glint: f.glint,
      t: 0, dur: 0.25 + Math.random() * 0.15,
      scale: 0.35 + f.size * 0.07,    /* 常時きらめきより控えめに */
    });
  }
}

/* 色を暗くするユーティリティ("#rrggbb" を係数で減光) */
function shadeColor(hex, k) {
  const r = (parseInt(hex.slice(1, 3), 16) * k) | 0;
  const g = (parseInt(hex.slice(3, 5), 16) * k) | 0;
  const b = (parseInt(hex.slice(5, 7), 16) * k) | 0;
  return `rgb(${r},${g},${b})`;
}

/* 頂点列からポリゴンを描く(yScaleでひらひらの傾きを表現) */
function drawPoly(c, verts, yScale) {
  c.beginPath();
  c.moveTo(verts[0][0], verts[0][1] * yScale);
  for (let i = 1; i < verts.length; i++) c.lineTo(verts[i][0], verts[i][1] * yScale);
  c.closePath();
  c.fill();
}

/* ============================================================
   きらめき:貼り付いた箔が時々ちらっと光る(蒔絵の艶)
   ============================================================ */
const sparkles = [];
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let sparkleTimer = 0;

function updateSparkles(dt) {
  sparkleTimer -= dt;
  /* 一定間隔で、積もった箔の中からランダムに光らせる */
  if (sparkleTimer <= 0 && settled.length > 0 && !reduceMotion) {
    sparkleTimer = 0.18 + Math.random() * 0.25;
    const n = Math.min(1 + (settled.length / 800 | 0), 3);
    for (let i = 0; i < n; i++) {
      const s = settled[(Math.random() * settled.length) | 0];
      sparkles.push({ x: s.x, y: s.y, glint: s.glint, t: 0, dur: 0.5 + Math.random() * 0.4, scale: 1 });
    }
  }
  for (let i = sparkles.length - 1; i >= 0; i--) {
    sparkles[i].t += dt;
    if (sparkles[i].t > sparkles[i].dur) sparkles.splice(i, 1);
  }
}

function drawSparkles() {
  ctx.save();
  ctx.globalCompositeOperation = "lighter";  /* 加算合成で光らせる */
  for (const s of sparkles) {
    const p = s.t / s.dur;
    const a = Math.sin(p * Math.PI);          /* ふわっと明滅 */
    const r = (3 + a * 5) * (s.scale || 1);
    /* 中心の光 */
    const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, r);
    g.addColorStop(0, s.glint);
    g.addColorStop(1, "rgba(255,240,190,0)");
    ctx.globalAlpha = a * 0.8;
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, Math.PI * 2); ctx.fill();
    /* 十字の光条 */
    ctx.globalAlpha = a * 0.6;
    ctx.strokeStyle = s.glint;
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(s.x - r * 1.6, s.y); ctx.lineTo(s.x + r * 1.6, s.y);
    ctx.moveTo(s.x, s.y - r * 1.6); ctx.lineTo(s.x, s.y + r * 1.6);
    ctx.stroke();
  }
  ctx.restore();
}

/* ============================================================
   入力:タップで一振り、長押し・なぞりで撒き続ける
   ============================================================ */
const pointer = { down: false, x: 0, y: 0, holdTime: 0 };
const hint = document.getElementById("hint");
let touched = false;

/* 案内文を消す。キャンバスに触れたときだけでなく、
   お題に入ったときにも消す(型の上に文字が乗ってしまうため) */
function hideHint() {
  if (touched) return;
  touched = true;
  hint.classList.add("hidden");
}

/* フリック判定用:直近の指の軌跡(約100ms分)を覚えておく */
const trail = [];
const FLICK_SPEED = 2200;   /* これより速くなでると「ずらす」(px/秒)。速めのなぞりは撒き扱い */

function pushTrail(x, y) {
  const t = performance.now();
  trail.push({ x, y, t });
  while (trail.length > 0 && t - trail[0].t > 100) trail.shift();
}

function emitBurst(x, y, count, big) {
  for (let i = 0; i < count; i++) {
    /* お題モード中は匙の残りが尽きたら撒けない */
    if (odai.active && !odai.result) {
      if (odai.budget <= 0) return;
      odai.budget--;
      hudFill.style.width = (odai.budget / odai.budgetMax * 100) + "%";
    } else if (odai.active && odai.result) {
      return;   /* 結果表示中は撒けない */
    }
    if (flakes.length >= MAX_FLAKES) flakes.shift();  /* 上限超過時は古い箔を破棄 */
    const ox = (Math.random() - 0.5) * 26;
    const oy = (Math.random() - 0.5) * 18;
    flakes.push(makeFlake(x + ox, y + oy, big));
  }
}

function onDown(x, y) {
  pointer.down = true; pointer.x = x; pointer.y = y; pointer.holdTime = 0;
  trail.length = 0;
  pushTrail(x, y);
  emitBurst(x, y, 20, false);       /* タップの瞬間にぱっとひと振り(砂子中心なので多めに) */
  hideHint();
}
function onMove(x, y) {
  if (!pointer.down) return;
  pushTrail(x, y);
  /* なぞった軌跡に沿って撒く */
  const dx = x - pointer.x, dy = y - pointer.y;
  const dist = Math.hypot(dx, dy);
  const steps = Math.max(1, Math.min((dist / 14) | 0, 6));
  for (let i = 1; i <= steps; i++) {
    emitBurst(pointer.x + dx * i / steps, pointer.y + dy * i / steps, 3, false);
  }
  pointer.x = x; pointer.y = y;
}
function onUp() {
  if (!pointer.down) return;
  pointer.down = false;
  /* フリック判定:直近の軌跡から離した瞬間の速度を求める */
  if (trail.length >= 2) {
    const a = trail[0], b = trail[trail.length - 1];
    const dtms = b.t - a.t;
    if (dtms > 15) {
      const vx = (b.x - a.x) / dtms * 1000;   /* px/秒 */
      const vy = (b.y - a.y) / dtms * 1000;
      if (Math.hypot(vx, vy) >= FLICK_SPEED) {
        if (odai.active) {
          /* お題中は採点が絡むので、ずらさずに同じ型でやり直し */
          resetRound();
          washAway();
        } else {
          /* 払った!→ 指のそばの箔だけを、その向きへすべらせる */
          slidePush(trail.slice(), b.x - a.x, b.y - a.y);
        }
      }
    }
  }
  trail.length = 0;
}

/* ポインターイベント(マウス・タッチ共通)
   押した指は setPointerCapture で捕まえておく。捕まえないと、指が下部の
   操作帯に載った瞬間 pointermove が canvas へ来なくなり、pointer.down だけ
   true のまま「最後に canvas で見た位置」へ撒き続けてしまう */
cv.addEventListener("pointerdown", e => {
  e.preventDefault();
  try { cv.setPointerCapture(e.pointerId); } catch (_) { /* 捕まえられなくても動く */ }
  onDown(e.clientX, e.clientY);
});
cv.addEventListener("pointermove", e => { e.preventDefault(); onMove(e.clientX, e.clientY); });
window.addEventListener("pointerup", onUp);
window.addEventListener("pointercancel", onUp);

/* ============================================================
   場面転換:お題の開始時に、画面を下へ洗い流して切り替える
   ============================================================ */
let washing = null;  /* { t } 洗い流しアニメーション中の状態 */

/* 洗い流し処理本体(お題のやり直しでも使う) */
function washAway() {
  if (washing) return;
  if (settled.length === 0 && flakes.length === 0) {
    flakes.length = 0;
    return;
  }
  /* 現在の沈殿レイヤーを退避して、流れ落ちる演出に使う */
  const snap = document.createElement("canvas");
  snap.width = sedCv.width; snap.height = sedCv.height;
  snap.getContext("2d").drawImage(sedCv, 0, 0);
  washing = { t: 0, snap };
  /* 本体は即クリア(以降の新しい箔は普通に積もれる) */
  sedCtx.clearRect(0, 0, W, H);
  settled.length = 0;
  sparkles.length = 0;
  flakes.length = 0;
}

/* ============================================================
   ずらす:指で払った「その場所の箔だけ」を、なぞった向きへ動かす
   ------------------------------------------------------------
   もとは画面じゅうの箔をいっせいに舞い上げて飛ばしていたが、
   それでは細かい直しに使えない。指の通り道のそばにある箔だけを
   拾い上げ、すべらせて、少し先に置き直す。手で蒔絵をならす感じ。

   ・指から遠いほど動かない(通り道からの距離でなだらかに弱まる)
   ・動く距離は指の動いた量に比例する。ゆっくり払えば少しだけ動く
   ・画面の外へは飛ばさない。必ずどこかに落ち着く
   ============================================================ */
const sliding = [];            /* すべっている最中の箔 */
const PUSH_RADIUS = 78;        /* 指の通り道から、この距離までが動く(px) */
const PUSH_MAX = 130;          /* いちばん強いときでも、これ以上は動かさない(px) */
const PUSH_DUR = 0.28;         /* すべっている時間(秒) */

/* 点と線分の距離 */
function distToSegment(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const len2 = dx * dx + dy * dy;
  if (len2 === 0) return Math.hypot(px - ax, py - ay);
  let t = ((px - ax) * dx + (py - ay) * dy) / len2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (ax + dx * t), py - (ay + dy * t));
}

/* 指の通り道(点列)からの、いちばん近い距離 */
function distToPath(px, py, path) {
  let d = Infinity;
  for (let i = 1; i < path.length; i++) {
    d = Math.min(d, distToSegment(px, py, path[i - 1].x, path[i - 1].y, path[i].x, path[i].y));
    if (d === 0) break;
  }
  return d;
}

/* 払った:通り道のそばの箔を拾って、なぞった向きへすべらせる */
function slidePush(path, dx, dy) {
  const travel = Math.hypot(dx, dy);
  if (travel < 1) return 0;
  const ux = dx / travel, uy = dy / travel;
  const reach = Math.min(travel, PUSH_MAX);     /* 指が動いたぶんだけ動かす */

  const kept = [];
  let moved = 0;
  for (const r of settled) {
    const d = distToPath(r.x, r.y, path);
    if (d >= PUSH_RADIUS) { kept.push(r); continue; }
    /* 通り道の真上がいちばん強く、離れるほどなだらかに弱まる */
    const w = Math.pow(1 - d / PUSH_RADIUS, 1.3);
    const dist = reach * w;
    if (dist < 0.6) { kept.push(r); continue; }   /* ほとんど動かないものは置いたまま */
    /* すべる先。ほんの少しだけ横にも散らす(手でならしたときのばらつき) */
    const jitter = (Math.random() - 0.5) * 6 * w;
    sliding.push({
      rec: r,
      x0: r.x, y0: r.y,
      x1: r.x + ux * dist - uy * jitter,
      y1: r.y + uy * dist + ux * jitter,
      rot0: r.rot,
      rot1: r.rot + (Math.random() - 0.5) * 0.5 * w,
      t: 0, dur: PUSH_DUR * (0.8 + Math.random() * 0.4),
    });
    moved++;
  }
  if (moved === 0) return 0;

  /* 拾った箔は沈殿レイヤーから外す(残った記録から描き直す) */
  settled.length = 0;
  for (const r of kept) settled.push(r);
  rebuildSediment();
  sparkles.length = 0;
  return moved;
}

/* すべっている箔を進め、着いたものは置き直す */
function updateSliding(dt) {
  for (let i = sliding.length - 1; i >= 0; i--) {
    const s = sliding[i];
    s.t += dt;
    if (s.t < s.dur) continue;
    /* 着いた:その場所へ置き直して、また記録に戻す */
    const r = s.rec;
    r.x = s.x1; r.y = s.y1; r.rot = s.rot1;
    /* 画面の中に収める */
    r.x = Math.max(2, Math.min(W - 2, r.x));
    r.y = Math.max(2, Math.min(H - 2, r.y));
    paintSettled(sedCtx, r);
    settled.push(r);
    sliding.splice(i, 1);
  }
  if (settled.length > MAX_SETTLED_RECORDS) {
    paintSettled(baseCtx, settled.shift());
  }
}

function drawSliding() {
  for (const s of sliding) {
    const p = Math.min(s.t / s.dur, 1);
    const e = 1 - Math.pow(1 - p, 3);           /* すっと出て、ふわりと止まる */
    const r = s.rec;
    ctx.save();
    ctx.translate(s.x0 + (s.x1 - s.x0) * e, s.y0 + (s.y1 - s.y0) * e);
    ctx.rotate(s.rot0 + (s.rot1 - s.rot0) * e);
    ctx.globalAlpha = r.flipped ? 0.85 : r.bright;
    ctx.fillStyle = r.color;
    drawPoly(ctx, r.verts, 1);
    ctx.restore();
  }
}

/* ============================================================
   お題モード(蒔絵のお題)
   ------------------------------------------------------------
   ・型(駒・三日月・扇・富士)が薄く浮かび、「ひと匙」=限られた
     量の箔だけでその形に蒔く
   ・採点は2軸:
     埋まり … 型の内側をどれだけ広く覆えたか(升目の踏破率)
     こぼれ … 撒いた箔のうち型の外に落ちた割合(面積の重み付き)
   ・評価は 見習い → 職人 → 名人
   ============================================================ */

/* 型は core.js が持つ。ここでは点列を Path2D に起こすだけ。
   面積・ひと匙の量・こぼれの許し幅・難易度は、すべて型の形から
   計算で決まる(core.js)。手で数字を振らない */
const SHAPES = Core.buildShapes();

/* 点列から Path2D を作る */
function pathOf(points, m) {
  const p = new Path2D();
  p.moveTo(points[0][0], points[0][1]);
  for (let i = 1; i < points.length; i++) p.lineTo(points[i][0], points[i][1]);
  p.closePath();
  const out = new Path2D();
  out.addPath(p, m);
  return out;
}

/* 点の内外判定専用の小さなコンテキスト(変換の影響を受けないように分離) */
const hitCtx = document.createElement("canvas").getContext("2d");

const odai = {
  active: false,
  shapeIdx: 0,
  tPath: null,          /* 画面座標に変換済みのPath2D */
  budgetMax: 0,         /* ひと匙。型の広さから決まる(core.js) */
  budget: 0,
  inW: 0, outW: 0,      /* 内/外に落ちた箔の重み(面積)合計 */
  zoneSet: new Set(),   /* 型の内側にある升目(埋まり判定用) */
  zoneHit: new Set(),   /* 箔が届いた升目 */
  grid: null,           /* 升目の原点と間隔 { ox, oy, step } */
  result: null,         /* 採点結果(表示中はここに入る) */
  settleTimer: 0,       /* 匙が尽きてから採点までの待ち */
};

const hud = document.getElementById("odai-hud");
const hudName = document.getElementById("odai-name");
const hudLevel = document.getElementById("odai-level");
const hudLabel = document.getElementById("odai-gauge-label");
const hudFill = document.getElementById("odai-gauge-fill");
const resultEl = document.getElementById("result");

/* ============================================================
   記録:型ごとの最高、名人の数、連続。端末に残す
   ------------------------------------------------------------
   畳み込みと段位の計算は core.js 側(DOMを触らないのでテストできる)。
   ここは読み書きだけを受け持つ
   ============================================================ */
const STORE_KEY = "kinpaku-records-v1";
let records = Core.emptyRecords();

function loadRecords() {
  try {
    records = Core.reviveRecords(JSON.parse(localStorage.getItem(STORE_KEY)));
  } catch (_) {
    records = Core.emptyRecords();   /* 読めなくても遊べるようにする */
  }
}
function saveRecords() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(records)); } catch (_) { /* 容量超過などは黙って諦める */ }
}
loadRecords();

/* 型を画面中央に配置し、升目(埋まり判定のマス)を敷き直す */
function buildShapeGeometry() {
  const s = Math.min(W, H) * 0.32;          /* 型の大きさ */
  const cx = W / 2, cy = H * 0.42;          /* 少し上寄りに置く(下は操作帯) */
  const m = new DOMMatrix().translate(cx, cy).scale(s);
  odai.tPath = pathOf(SHAPES[odai.shapeIdx].points, m);

  /* 型を覆う範囲に升目を敷き、中心が型の内側にある升だけ登録 */
  const step = s * 0.27;
  const ox = cx - s * 1.15, oy = cy - s * 1.15;
  odai.grid = { ox, oy, step };
  odai.zoneSet.clear();
  const n = Math.ceil((s * 2.3) / step);
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      const px = ox + (i + 0.5) * step;
      const py = oy + (j + 0.5) * step;
      if (hitCtx.isPointInPath(odai.tPath, px, py)) {
        odai.zoneSet.add(i + "," + j);
      }
    }
  }
}

/* ラウンド開始/やり直し(型は変えずに匙と記録をリセット) */
function resetRound() {
  const shape = SHAPES[odai.shapeIdx];
  odai.budgetMax = shape.budget;        /* ひと匙は型の広さぶん */
  odai.budget = odai.budgetMax;
  odai.inW = 0; odai.outW = 0;
  odai.zoneHit.clear();
  odai.result = null;
  odai.settleTimer = 0;
  resultEl.classList.remove("show");
  hudName.textContent = "『" + shape.name + "』に蒔く";
  hudLevel.textContent = "◆".repeat(shape.difficulty) + "◇".repeat(5 - shape.difficulty);
  hudLabel.textContent = "ひと匙 " + odai.budgetMax + "枚";
  hudFill.style.width = "100%";
}

/* 新しいお題を引いて開始 */
function startOdai(newShape) {
  odai.active = true;
  if (newShape) {
    /* 直前と同じ型は避ける */
    let idx;
    do { idx = (Math.random() * SHAPES.length) | 0; }
    while (idx === odai.shapeIdx && SHAPES.length > 1);
    odai.shapeIdx = idx;
  }
  buildShapeGeometry();
  washAway();
  resetRound();
  hideHint();                 /* 案内文が型に重なるので消す */
  hud.classList.add("show");
  document.getElementById("btn-odai").textContent = "自由へ";
}

/* お題モードを抜ける(作品はそのまま残す) */
function endOdai() {
  odai.active = false;
  odai.result = null;
  hud.classList.remove("show");
  resultEl.classList.remove("show");
  document.getElementById("btn-odai").textContent = "お題";
}

document.getElementById("btn-odai").addEventListener("click", () => {
  odai.active ? endOdai() : startOdai(true);
});
document.getElementById("btn-retry").addEventListener("click", () => {
  startOdai(true);   /* 別の型へ */
});
document.getElementById("btn-again").addEventListener("click", () => {
  startOdai(false);  /* 同じ型でやり直す */
});
document.getElementById("btn-free").addEventListener("click", endOdai);

/* ============================================================
   記録の帳
   ============================================================ */
const bookEl = document.getElementById("book");

function showBook() {
  const g = Core.grade(records, SHAPES.length);
  document.getElementById("book-grade").textContent = g.name;
  document.getElementById("book-summary").textContent =
    "名人の型 " + g.done + "/" + g.of + " ・ 蒔いた回数 " + records.rounds +
    " ・ 連続の最高 " + records.bestStreak;

  const rows = SHAPES.map((sh) => {
    const b = records.best[sh.name];
    const rank = b ? b.rank : "まだ";
    const detail = b ? Math.round(b.fill * 100) + "% / " + Math.round(b.spill * 100) + "%" : "—";
    return "<tr><td class=\"name\">『" + sh.name + "』</td>" +
           "<td>" + "◆".repeat(sh.difficulty) + "</td>" +
           "<td class=\"rank-" + rank + "\">" + rank + "</td>" +
           "<td>" + detail + "</td></tr>";
  }).join("");
  document.getElementById("book-table").innerHTML = rows;
  bookEl.classList.add("show");
}

document.getElementById("btn-book").addEventListener("click", showBook);
document.getElementById("btn-book-close").addEventListener("click", () => {
  bookEl.classList.remove("show");
});

/* ============================================================
   写す:いま積もっている箔を1枚の絵にして、残す/送る
   ============================================================ */
const toastEl = document.getElementById("toast");
let toastTimer = 0;

function toast(text) {
  toastEl.textContent = text;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
}

/* 画面の飾り(型の輪郭・舞っている箔)を除いた、作品そのものを組む */
function composeArtwork() {
  const out = document.createElement("canvas");
  out.width = sedCv.width; out.height = sedCv.height;
  const c = out.getContext("2d");
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBackground(c);
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.drawImage(sedCv, 0, 0);
  /* 隅に題字を小さく添える */
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.fillStyle = "rgba(201,162,75,0.75)";
  c.font = '13px "Hiragino Mincho ProN", "Yu Mincho", serif';
  c.textAlign = "right";
  c.fillText("金箔ひらひら", W - 16, H - 16);
  return out;
}

function saveArtwork() {
  if (settled.length === 0) { toast("まだ何も蒔かれていません"); return; }
  const out = composeArtwork();
  out.toBlob((blob) => {
    if (!blob) { toast("写せませんでした"); return; }
    const file = new File([blob], "kinpaku.png", { type: "image/png" });
    /* 送れる端末では共有シートへ。だめなら保存する */
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file] }).then(() => toast("送りました")).catch(() => { /* 取り消しは何もしない */ });
      return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "kinpaku.png";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    toast("写しました");
  }, "image/png");
}

document.getElementById("btn-save").addEventListener("click", saveArtwork);

/* 払う:積もった箔を全部流す。
   お題の最中は採点が絡むので、同じ型でのやり直しにする */
document.getElementById("btn-clear").addEventListener("click", () => {
  if (settled.length === 0 && flakes.length === 0 && sliding.length === 0 && !odai.active) {
    toast("まだ何も蒔かれていません");
    return;
  }
  sliding.length = 0;
  baseCtx.clearRect(0, 0, W, H);   /* 記録から溢れて下地へ焼いたぶんも消す */
  washAway();
  if (odai.active) resetRound();   /* ひと匙も戻す */
});

/* 画面回転などでサイズが変わったら、型と升目を敷き直す */
window.addEventListener("resize", () => {
  if (odai.active) buildShapeGeometry();
});

/* 貼り付いた箔の内外を記録(stampFlakeから呼ばれる) */
function odaiRecord(f) {
  if (!odai.active || odai.result) return;
  const w = f.size * f.size;   /* 面積の重み */
  if (hitCtx.isPointInPath(odai.tPath, f.x, f.y)) {
    odai.inW += w;
    const g = odai.grid;
    const key = Math.floor((f.x - g.ox) / g.step) + "," + Math.floor((f.y - g.oy) / g.step);
    if (odai.zoneSet.has(key)) odai.zoneHit.add(key);
  } else {
    odai.outW += w;
  }
}

/* 採点:埋まり(升目の踏破率)とこぼれ(外に落ちた重みの割合) */
function judgeOdai() {
  const shape = SHAPES[odai.shapeIdx];
  const fill  = odai.zoneSet.size > 0 ? odai.zoneHit.size / odai.zoneSet.size : 0;
  const total = odai.inW + odai.outW;
  const spill = total > 0 ? odai.outW / total : 1;

  /* 採点の線引きは型ごとに違う(細い型はこぼれを多めに許す)。core.js が決める */
  const { rank, word } = Core.judge(fill, spill, shape);
  const result = { rank, fill, spill };
  odai.result = result;

  /* 記録を更新する前に、これが自己最高を塗り替えたかを見る */
  const prev = records.best[shape.name];
  const 初めて = !prev;
  const 塗り替え = prev && Core.rankValue(rank) > Core.rankValue(prev.rank);
  records = Core.applyResult(records, shape.name, result);
  saveRecords();

  document.getElementById("result-rank").textContent = rank;
  document.getElementById("result-detail").textContent =
    "埋まり " + Math.round(fill * 100) + "% ・ こぼれ " + Math.round(spill * 100) + "%";
  /* この型でこぼれをどこまで許すかは形で決まる。目標が見えるように出す */
  document.getElementById("result-limit").textContent =
    "この型は こぼれ " + Math.round(shape.spillMax * 100) + "% まで";

  /* 自己最高・連続・段位のうち、いちばん嬉しいものを一行で出す */
  const g = Core.grade(records, SHAPES.length);
  let note = "";
  if (g.name === "皆伝" && 塗り替え) note = "皆伝。すべての型で名人です";
  else if (塗り替え || (初めて && Core.rankValue(rank) > 0)) note = "『" + shape.name + "』の自己最高";
  else if (records.streak >= 2) note = records.streak + " 回続けて職人以上";
  else if (g.done > 0) note = "名人の型 " + g.done + " / " + g.of + "  (" + g.name + ")";
  document.getElementById("result-note").textContent = note;

  document.getElementById("result-word").textContent = word;
  resultEl.classList.add("show");
}

/* 型の輪郭を薄く描く(毎フレーム、積もった箔の上に) */
function drawShapeOutline() {
  if (!odai.active) return;
  ctx.save();
  ctx.setLineDash([6, 7]);
  ctx.lineDashOffset = -performance.now() / 120;   /* 輪郭がゆっくり巡る */
  ctx.strokeStyle = "rgba(230,200,130,0.35)";
  ctx.lineWidth = 1.4;
  ctx.stroke(odai.tPath);
  ctx.restore();
}

/* ============================================================
   色の切り替え
   ============================================================ */
const swatches = { gold: "sw-gold", silver: "sw-silver", copper: "sw-copper" };
for (const [key, id] of Object.entries(swatches)) {
  document.getElementById(id).addEventListener("click", () => {
    currentPalette = key;
    for (const id2 of Object.values(swatches)) {
      document.getElementById(id2).classList.toggle("active", id2 === id);
    }
  });
}

/* ============================================================
   背景:真っ黒で固定。箔の金をいちばん際立たせるため、
   中央を温める照りも斜めの艶も置かない
   ============================================================ */
const BG = "#000000";

function drawBackground(c) {
  c.fillStyle = BG;
  c.fillRect(0, 0, W, H);
}

/* ============================================================
   メインループ
   ============================================================ */
let lastT = performance.now();

function frame(now) {
  const dt = Math.min((now - lastT) / 1000, 0.05);  /* タブ復帰時の暴走防止 */
  lastT = now;

  /* --- 長押し中は撒き続ける(押している時間で少しずつ勢いが増す) --- */
  if (pointer.down) {
    pointer.holdTime += dt;
    const rate = Math.min(3 + pointer.holdTime * 3, 9);  /* 毎フレームの発生数 */
    emitBurst(pointer.x, pointer.y, rate | 0, pointer.holdTime > 1.2);
  }

  /* --- 舞っている箔の更新 --- */
  for (let i = flakes.length - 1; i >= 0; i--) {
    const f = flakes[i];
    f.vy += 2.2 * dt;                        /* 弱い重力 */
    f.vy = Math.min(f.vy, 1.6);              /* 終端速度(ひらひら感を保つ) */
    f.swayPhase += (1.5 + f.swayAmp) * dt * 2.2;
    f.x += f.vx + Math.sin(f.swayPhase) * f.swayAmp;
    f.y += f.vy;
    f.vx *= 0.985;                           /* 空気抵抗 */
    f.rot += f.vr;
    f.facePhase += f.faceRate;

    /* 画面外(左右・上)へ流れた箔は破棄 */
    if (f.x < -20 || f.x > W + 20 || f.y < -30) { flakes.splice(i, 1); continue; }

    /* 貼り付き判定:落下中(vy>0)に既定の高さへ達したら焼き込む */
    if (f.vy > 0 && f.y >= Math.min(f.settleY, H - 4)) {
      stampFlake(f);
      flakes.splice(i, 1);
    }
  }

  updateSparkles(dt);
  updateSliding(dt);

  /* --- 描画 --- */
  drawBackground(ctx);

  /* 洗い流しアニメーション:退避した層が下へ流れながら薄れる */
  if (washing) {
    washing.t += dt;
    const p = Math.min(washing.t / 1.4, 1);
    const ease = p * p * (3 - 2 * p);        /* smoothstep */
    ctx.save();
    ctx.globalAlpha = 1 - ease;
    ctx.drawImage(washing.snap, 0, ease * H * 0.6, W, H);
    ctx.restore();
    if (p >= 1) washing = null;
  }

  /* 積もった箔 */
  ctx.drawImage(sedCv, 0, 0, W, H);

  /* すべっている最中の箔 */
  drawSliding();

  /* お題の型の輪郭(積もった箔の上、舞う箔の下) */
  drawShapeOutline();

  /* お題の採点:匙が尽き、すべての箔が落ち切ったら少し間を置いて判定 */
  if (odai.active && !odai.result && odai.budget <= 0 &&
      flakes.length === 0 && !washing) {
    odai.settleTimer += dt;
    if (odai.settleTimer > 0.8) judgeOdai();
  }

  /* 舞っている箔:表裏の傾きで明るさと縦幅が変わる=きらめき */
  for (const f of flakes) {
    const face = Math.sin(f.facePhase);              /* -1..1 表裏の傾き */
    const yScale = Math.abs(face) * 0.85 + 0.15;     /* 端に向くと細く */
    const bright = Math.abs(face);
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.rot);
    ctx.fillStyle = f.color;
    ctx.globalAlpha = 0.55 + bright * 0.45;
    drawPoly(ctx, f.verts, yScale);
    /* 面がこちらを向いた瞬間、glint色でひときわ光る */
    if (bright > 0.88) {
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = (bright - 0.88) / 0.12 * 0.7;
      ctx.fillStyle = f.glint;
      drawPoly(ctx, f.verts, yScale);
    }
    ctx.restore();
  }

  drawSparkles();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ============================================================
   テストからのぞくための入口
   ------------------------------------------------------------
   ロジックが画面と同じところに居るので、ブラウザテストから
   中身を確かめる手立てがこれしかない。動作には関わらない。
   ============================================================ */
window.__app = {
  flakes, settled, sliding, sparkles, odai, SHAPES,
  Core,
  slidePush, PUSH_RADIUS,
  get records() { return records; },
  setRecords(r) { records = Core.reviveRecords(r); saveRecords(); },
  composeArtwork,
  /* 型を指定して組み直す(採点の当たり判定に使うPath2Dが手に入る) */
  useShape(i) {
    odai.shapeIdx = i;
    buildShapeGeometry();
    return odai.tPath;
  },
  isInsideShape(x, y) { return hitCtx.isPointInPath(odai.tPath, x, y); },
};

/* ============================================================
   PWA:Service Worker登録(オフラインでも遊べるように)
   ============================================================ */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {
      /* 登録失敗時も通常のWebページとして動くので何もしない */
    });
  });
}
</script>
